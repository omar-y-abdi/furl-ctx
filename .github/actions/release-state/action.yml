name: Canonical release state
description: Establish immutable tags and finalize byte-verified GitHub Releases.

inputs:
  mode:
    description: establish or finalize
    required: true
  version:
    description: Canonical release version
    required: true
  release-sha:
    description: Immutable source commit SHA
    required: true
  require-existing-tag:
    description: Refuse to create a missing tag
    required: false
    default: "false"
  dist-dir:
    description: Canonical distributions directory (finalize mode)
    required: false
    default: dist
  halt:
    description: Global release circuit breaker
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Validate release-state request and circuit breaker
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        HALT: ${{ inputs.halt }}
      run: |
        [[ "$MODE" == "establish" || "$MODE" == "finalize" ]] || {
          echo "::error::Unsupported release-state mode: $MODE"
          exit 1
        }
        if [[ "$HALT" == "true" ]]; then
          echo "::error::RELEASE_HALT=true: refusing public release side effects."
          exit 1
        fi

    - name: Establish or re-prove immutable tag
      if: inputs.mode == 'establish'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: v${{ inputs.version }}
        EXPECTED_SHA: ${{ inputs.release-sha }}
        REQUIRE_TAG: ${{ inputs.require-existing-tag }}
      run: |
        retry() {
          local n=1
          until "$@"; do
            [[ "$n" == "5" ]] && return 1
            sleep $((n * 4))
            n=$((n + 1))
          done
        }

        # 0 = exact match, 2 = genuinely absent, 1 = mismatch/transport ambiguity.
        verify_tag_identity() {
          local n rc output tag_sha
          for n in 1 2 3; do
            if output="$(git ls-remote --exit-code --refs origin "refs/tags/${TAG}" 2>&1)"; then
              rc=0
            else
              rc=$?
            fi
            if [[ "$rc" -eq 0 ]]; then
              retry git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}" || return 1
              tag_sha="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")" || return 1
              if [[ "$tag_sha" != "$EXPECTED_SHA" ]]; then
                echo "::error::${TAG} points to ${tag_sha}; expected ${EXPECTED_SHA}. Tag mutation is forbidden."
                return 1
              fi
              return 0
            fi
            if [[ "$rc" -eq 2 ]]; then
              return 2
            fi
            echo "::warning::Could not query ${TAG} (attempt ${n}/3): ${output}" >&2
            [[ "$n" -lt 3 ]] && sleep $((n * 4))
          done
          return 1
        }

        if verify_tag_identity; then
          echo "${TAG} already exists at the exact release SHA."
          exit 0
        else
          state=$?
        fi
        [[ "$state" -ne 1 ]] || exit 1
        if [[ "$REQUIRE_TAG" == "true" ]]; then
          echo "::error::Recovery requires pre-existing immutable tag ${TAG}."
          exit 1
        fi

        if ! retry gh api --method POST -H 'Accept: application/vnd.github+json' \
          "repos/${GITHUB_REPOSITORY}/git/refs" \
          -f ref="refs/tags/${TAG}" -f sha="$EXPECTED_SHA" >/dev/null; then
          # Concurrent creation is acceptable only if the winner created the
          # exact same immutable ref.
          verify_tag_identity
          exit $?
        fi
        verify_tag_identity
        echo "Established immutable ${TAG} -> ${EXPECTED_SHA}."

    - name: Finalize GitHub Release after registry publication
      if: inputs.mode == 'finalize'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: v${{ inputs.version }}
        EXPECTED_SHA: ${{ inputs.release-sha }}
        DIST_DIR: ${{ inputs.dist-dir }}
      run: |
        retry() {
          local n=1
          until "$@"; do
            [[ "$n" == "5" ]] && return 1
            sleep $((n * 5))
            n=$((n + 1))
          done
        }

        verify_tag_identity() {
          local output rc tag_sha
          if output="$(git ls-remote --exit-code --refs origin "refs/tags/${TAG}" 2>&1)"; then
            rc=0
          else
            rc=$?
          fi
          [[ "$rc" -eq 0 ]] || {
            echo "::error::Cannot resolve required release tag ${TAG}: ${output}"
            return 1
          }
          retry git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}" || return 1
          tag_sha="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")" || return 1
          [[ "$tag_sha" == "$EXPECTED_SHA" ]] || {
            echo "::error::${TAG} resolves to ${tag_sha}; refusing assets built from ${EXPECTED_SHA}."
            return 1
          }
        }
        verify_tag_identity

        shopt -s nullglob
        wheels=("$DIST_DIR"/*.whl)
        sdists=("$DIST_DIR"/*.tar.gz)
        if (( ${#wheels[@]} == 0 || ${#sdists[@]} != 1 )); then
          echo "::error::Expected wheels plus exactly one sdist in ${DIST_DIR}."
          exit 1
        fi

        manifest_dir="${RUNNER_TEMP}/canonical-release-manifest"
        rm -rf "$manifest_dir"
        mkdir -p "$manifest_dir"
        (cd "$DIST_DIR" && sha256sum *.whl *.tar.gz | LC_ALL=C sort) > "$manifest_dir/SHA256SUMS"

        # Inspect the exact expected release-asset namespace. Auxiliary assets are
        # allowed, but another wheel/sdist is a conflicting distribution set.
        inspect_remote_assets() {
          local destination="$1" missing_file="$2"
          rm -rf "$destination"
          mkdir -p "$destination"
          asset_count="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" || return 1
          if (( asset_count > 0 )); then
            if ! retry gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$destination"; then
              echo "::error::Could not download assets for existing ${TAG}."
              return 1
            fi
          fi
          DIST_DIR="$DIST_DIR" PUBLISHED_DIR="$destination" MANIFEST="$manifest_dir/SHA256SUMS" MISSING_FILE="$missing_file" python - <<'PY'
        import hashlib
        import os
        import pathlib

        dist = pathlib.Path(os.environ["DIST_DIR"])
        published = pathlib.Path(os.environ["PUBLISHED_DIR"])
        manifest = pathlib.Path(os.environ["MANIFEST"])
        expected = {
            p.name: hashlib.sha256(p.read_bytes()).hexdigest()
            for p in dist.iterdir()
            if p.name.endswith((".whl", ".tar.gz"))
        }
        expected["SHA256SUMS"] = hashlib.sha256(manifest.read_bytes()).hexdigest()

        remote_files = {p.name: p for p in published.iterdir() if p.is_file()}
        unexpected_dist = sorted(
            name for name in remote_files
            if name.endswith((".whl", ".tar.gz")) and name not in expected
        )
        mismatch = sorted(
            name for name, digest in expected.items()
            if name in remote_files
            and hashlib.sha256(remote_files[name].read_bytes()).hexdigest() != digest
        )
        if unexpected_dist or mismatch:
            raise SystemExit(
                "GitHub Release conflicts with canonical bytes: "
                f"unexpected_dist={unexpected_dist} mismatch={mismatch}"
            )
        missing = sorted(name for name in expected if name not in remote_files)
        pathlib.Path(os.environ["MISSING_FILE"]).write_text("\n".join(missing) + ("\n" if missing else ""))
        print(f"GitHub Release inspection: expected={len(expected)} missing={missing}")
        PY
        }

        # Remote observation is tri-state: present, confirmed absent, or unknown. Never reinterpret transport/API/auth
        # ambiguity as absence, because doing so authorizes a create mutation from an unproven state.
        query_release_state() {
          local n output rc err_file err
          err_file="${RUNNER_TEMP}/release-view-error"
          for n in 1 2 3; do
            : > "$err_file"
            if output="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isImmutable,tagName 2>"$err_file")"; then
              printf '%s\n' "$output"
              return 0
            else
              rc=$?
            fi
            err="$(cat "$err_file")"
            if grep -Eiq '(release not found|HTTP 404|Not Found)' <<<"$err"; then
              return 2
            fi
            echo "::warning::Could not determine release state for ${TAG} (attempt ${n}/3, rc=${rc}): ${err}" >&2
            [[ "$n" -lt 3 ]] && sleep $((n * 5))
          done
          return 1
        }

        release_exists=false
        release_is_draft=false
        release_is_immutable=false
        release_json=""
        if release_json="$(query_release_state)"; then
          release_exists=true
          [[ "$(jq -r '.tagName' <<<"$release_json")" == "$TAG" ]] || {
            echo "::error::Release lookup returned an unexpected tag."
            exit 1
          }
          release_is_draft="$(jq -r '.isDraft' <<<"$release_json")"
          release_is_immutable="$(jq -r '.isImmutable' <<<"$release_json")"
        else
          release_state=$?
          if [[ "$release_state" -ne 2 ]]; then
            echo "::error::Release state for ${TAG} is unknown after retries; refusing any mutation."
            exit 1
          fi
        fi

        if [[ "$release_exists" == "false" ]]; then
          # Never expose an incomplete first-time release. A draft is staged,
          # byte-verified, and only then made public.
          retry gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --draft --title "Release $TAG" --generate-notes
          release_exists=true
          release_is_draft=true
          release_is_immutable=false
        fi

        if [[ "$release_is_draft" == "true" ]]; then
          # Drafts are private staging state, so convergence may safely replace
          # same-name assets left by an interrupted earlier attempt.
          retry gh release upload "$TAG" "${wheels[@]}" "${sdists[@]}" "$manifest_dir/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --clobber

          draft_download="${RUNNER_TEMP}/draft-release-assets"
          missing_file="${RUNNER_TEMP}/draft-missing-assets"
          inspect_remote_assets "$draft_download" "$missing_file"
          if [[ -s "$missing_file" ]]; then
            echo "::error::Draft ${TAG} is still missing canonical assets after upload:"
            cat "$missing_file" >&2
            exit 1
          fi

          # Publication is the final state transition: all canonical assets were
          # already present and verified while the release was still a draft.
          retry gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          release_is_draft=false
        else
          # Idempotent public-release recovery. Never overwrite an existing byte. Any collision/mismatch
          # already failed in inspect_remote_assets; immutable releases must already be complete.
          published="${RUNNER_TEMP}/published-release-assets-preflight"
          missing_file="${RUNNER_TEMP}/published-missing-assets"
          inspect_remote_assets "$published" "$missing_file"
          if [[ -s "$missing_file" ]]; then
            if [[ "$release_is_immutable" == "true" ]]; then
              echo "::error::Immutable public release ${TAG} is incomplete; refusing an impossible in-place repair."
              cat "$missing_file" >&2
              exit 1
            fi
            upload=()
            while IFS= read -r name; do
              [[ -n "$name" ]] || continue
              if [[ "$name" == "SHA256SUMS" ]]; then
                upload+=("$manifest_dir/SHA256SUMS")
              else
                [[ -f "$DIST_DIR/$name" ]] || {
                  echo "::error::Missing canonical source for release asset $name"
                  exit 1
                }
                upload+=("$DIST_DIR/$name")
              fi
            done < "$missing_file"
            (( ${#upload[@]} > 0 )) && retry gh release upload "$TAG" "${upload[@]}" --repo "$GITHUB_REPOSITORY"
          fi
        fi

        # Final post-publication proof. This is also the idempotent success path
        # for an already-correct release and catches any transport/API anomaly.
        final_download="${RUNNER_TEMP}/published-release-assets-final"
        final_missing="${RUNNER_TEMP}/published-release-assets-final-missing"
        inspect_remote_assets "$final_download" "$final_missing"
        if [[ -s "$final_missing" ]]; then
          echo "::error::Published ${TAG} is missing canonical assets:"
          cat "$final_missing" >&2
          exit 1
        fi
        state="$(retry gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName)"
        [[ "$(jq -r '.tagName' <<<"$state")" == "$TAG" && "$(jq -r '.isDraft' <<<"$state")" == "false" ]] || {
          echo "::error::${TAG} did not converge to a published release."
          exit 1
        }
        verify_tag_identity
        echo "GitHub Release ${TAG} is public only after canonical assets were byte-verified."
