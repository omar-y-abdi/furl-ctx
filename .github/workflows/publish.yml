name: Publish to PyPI (manual fallback)

# Recovery only. This workflow NEVER rebuilds release bytes. It resolves the
# immutable vX.Y.Z tag, binds the source to the exact `.github/workflows/release.yml`
# workflow identity and source SHA, requires that run's successful release seal,
# verifies GitHub's SHA-256 digest for both the dist and seal artifacts, and then
# replays the exact recovered bytes through the same local canonical publication
# actions used by Release. Build failures stay in Release; this path can only
# replay a previously smoke-verified artifact set. The PyPI job itself remains
# in this workflow because Trusted Publishing binds authorization to its filename.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v"
        required: true
        type: string
      release_run_id:
        description: "Optional Release workflow run ID (auto-discovered when empty)"
        required: false
        type: string
      dry_run:
        description: "Resolve and verify artifacts only"
        required: false
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: bash -Eeuo pipefail {0}

jobs:
  recover-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    outputs:
      source_run_id: ${{ steps.resolve.outputs.run_id }}
      tag_sha: ${{ steps.tag.outputs.sha }}
      artifact_name: manual-release-dist-${{ inputs.version }}
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag source and requested version
        id: tag
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          tag_sha="$(git rev-parse HEAD^{commit})"
          echo "sha=$tag_sha" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import os
          import pathlib
          import tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          expected = os.environ["EXPECTED_VERSION"]
          if version != expected:
              raise SystemExit(f"tag/source version is {version}, expected {expected}")
          print(f"version OK: {version}")
          PY

      - name: Resolve exact Release workflow identity
        id: workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow_id="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml" --jq '.id')"
          test -n "$workflow_id"
          echo "id=$workflow_id" >> "$GITHUB_OUTPUT"
          echo "Release workflow ID: $workflow_id"

      - name: Resolve sealed Release run and verify artifact digests
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_SHA: ${{ steps.tag.outputs.sha }}
          RELEASE_WORKFLOW_ID: ${{ steps.workflow.outputs.id }}
          REQUESTED_RUN_ID: ${{ inputs.release_run_id }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          retry() {
            local n=1
            until "$@"; do
              [[ "$n" == "4" ]] && return 1
              sleep $((n * 5))
              n=$((n + 1))
            done
          }

          safe_extract() {
            local archive="$1" destination="$2"
            ARCHIVE="$archive" DESTINATION="$destination" python - <<'PY'
          import os
          import pathlib
          import zipfile
          archive = pathlib.Path(os.environ["ARCHIVE"])
          destination = pathlib.Path(os.environ["DESTINATION"])
          destination.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  path = pathlib.PurePosixPath(info.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe artifact member: {info.filename}")
              zf.extractall(destination)
          PY
          }

          download_artifact() {
            local artifact_id="$1" expected_digest="$2" destination="$3"
            local archive="${RUNNER_TEMP}/artifact-${artifact_id}.zip"
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
              --connect-timeout 15 --max-time 180 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              --output "$archive"
            actual="sha256:$(sha256sum "$archive" | awk '{print $1}')"
            [[ "$actual" == "$expected_digest" ]] || {
              echo "Artifact ${artifact_id} archive digest mismatch: ${actual} != ${expected_digest}" >&2
              return 1
            }
            rm -rf "$destination"
            safe_extract "$archive" "$destination"
          }

          validate_run() {
            local run_id="$1"
            local run_json jobs_json artifacts_json run_sha workflow_id run_event conclusion seal_ok
            run_json="$(retry gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")" || return 1
            run_sha="$(jq -r '.head_sha' <<<"$run_json")"
            workflow_id="$(jq -r '.workflow_id' <<<"$run_json")"
            run_event="$(jq -r '.event' <<<"$run_json")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
            [[ "$workflow_id" == "$RELEASE_WORKFLOW_ID" ]] || {
              echo "Run $run_id belongs to workflow_id=$workflow_id, expected $RELEASE_WORKFLOW_ID." >&2; return 1; }
            [[ "$run_event" == "push" || "$run_event" == "workflow_dispatch" ]] || {
              echo "Run $run_id has event=$run_event; only release push/manual runs are recovery sources." >&2; return 1; }
            [[ "$run_sha" == "$TAG_SHA" ]] || {
              echo "Run $run_id has head_sha=$run_sha, expected $TAG_SHA." >&2; return 1; }
            # The overall run may be failure solely because publication failed;
            # recovery therefore keys on the successful seal job, not run conclusion.
            jobs_json="$(retry gh api --paginate --slurp -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")" || return 1
            seal_ok="$(jq '[.[] | .jobs[] | select(.name == "seal-release-artifacts" and .conclusion == "success")] | length' <<<"$jobs_json")"
            (( seal_ok == 1 )) || {
              echo "Run $run_id has no unique successful release seal job." >&2; return 1; }

            artifacts_json="$(retry gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")" || return 1
            dist_count="$(jq '[.artifacts[] | select(.name == "dist" and .expired == false)] | length' <<<"$artifacts_json")"
            seal_name="release-seal-${EXPECTED_VERSION}"
            seal_count="$(jq --arg n "$seal_name" '[.artifacts[] | select(.name == $n and .expired == false)] | length' <<<"$artifacts_json")"
            (( dist_count == 1 && seal_count == 1 )) || {
              echo "Run $run_id lacks a unique retained dist/seal artifact: dist=$dist_count seal=$seal_count." >&2; return 1; }

            dist_id="$(jq -r '.artifacts[] | select(.name == "dist" and .expired == false) | .id' <<<"$artifacts_json")"
            dist_digest="$(jq -r '.artifacts[] | select(.name == "dist" and .expired == false) | .digest // ""' <<<"$artifacts_json")"
            seal_id="$(jq -r --arg n "$seal_name" '.artifacts[] | select(.name == $n and .expired == false) | .id' <<<"$artifacts_json")"
            seal_digest="$(jq -r --arg n "$seal_name" '.artifacts[] | select(.name == $n and .expired == false) | .digest // ""' <<<"$artifacts_json")"
            [[ "$dist_digest" == sha256:* && "$seal_digest" == sha256:* ]] || {
              echo "Run $run_id artifacts do not expose SHA-256 archive digests; refusing unverifiable recovery." >&2; return 1; }

            download_artifact "$dist_id" "$dist_digest" recovered-dist || return 1
            download_artifact "$seal_id" "$seal_digest" recovered-seal || return 1
            [[ -f recovered-seal/release-seal.json ]] || return 1
            RUN_ID="$run_id" python - <<'PY' || return 1
          import hashlib
          import json
          import os
          import pathlib

          seal = json.loads(pathlib.Path("recovered-seal/release-seal.json").read_text())
          expected = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": int(os.environ["RUN_ID"]),
              "version": os.environ["EXPECTED_VERSION"],
              "release_sha": os.environ["TAG_SHA"],
          }
          for key, value in expected.items():
              if seal.get(key) != value:
                  raise SystemExit(f"release seal {key} mismatch: {seal.get(key)!r} != {value!r}")
          actual = {
              p.name: hashlib.sha256(p.read_bytes()).hexdigest()
              for p in sorted(pathlib.Path("recovered-dist").iterdir())
              if p.name.endswith((".whl", ".tar.gz"))
          }
          if actual != seal.get("files"):
              raise SystemExit(
                  "recovered dist does not match sealed filename/digest set: "
                  f"actual={actual} sealed={seal.get('files')}"
              )
          print(f"Release seal verified for run {expected['run_id']} and {len(actual)} distribution(s).")
          PY
            return 0
          }

          selected=""
          if [[ -n "$REQUESTED_RUN_ID" ]]; then
            validate_run "$REQUESTED_RUN_ID" || {
              echo "::error::Requested Release run $REQUESTED_RUN_ID is not a sealed artifact source for $TAG_SHA."
              exit 1
            }
            selected="$REQUESTED_RUN_ID"
          else
            mapfile -t candidates < <(
              retry gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml \
                --commit "$TAG_SHA" --limit 30 --json databaseId,createdAt \
                --jq 'sort_by(.createdAt) | reverse | .[].databaseId'
            )
            for run_id in "${candidates[@]}"; do
              if validate_run "$run_id"; then
                selected="$run_id"
                break
              fi
            done
            if [[ -z "$selected" ]]; then
              echo "::error::No exact Release workflow run for $TAG_SHA has a successful retained release seal with verifiable artifact digests."
              exit 1
            fi
          fi
          echo "run_id=$selected" >> "$GITHUB_OUTPUT"
          echo "Recovered exact sealed distributions from Release run $selected."

      - name: Verify recovered distribution shape and metadata
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          expected = os.environ["EXPECTED_VERSION"]
          files = sorted(pathlib.Path("recovered-dist").iterdir())
          unexpected = [p.name for p in files if not p.name.endswith((".whl", ".tar.gz"))]
          wheels = [p for p in files if p.name.endswith(".whl")]
          sdists = [p for p in files if p.name.endswith(".tar.gz")]
          if unexpected or not wheels or len(sdists) != 1:
              raise SystemExit(f"invalid recovered set: wheels={len(wheels)} sdists={len(sdists)} unexpected={unexpected}")
          bad = []
          for path in wheels + sdists:
              version = path.name.split("-")[1] if path.name.endswith(".whl") else path.name[:-7].rsplit("-", 1)[-1]
              if version != expected:
                  bad.append(f"{path.name} -> {version}")
          if bad:
              raise SystemExit("artifact version mismatch: " + "; ".join(bad))
          print(f"Recovered {len(wheels)} wheel(s) + one sdist for {expected}.")
          PY
          python -m pip install --upgrade pip 'twine>=5,<7'
          python -m twine check recovered-dist/*

      - name: Preserve exact recovered bytes for canonical publisher
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: manual-release-dist-${{ inputs.version }}
          path: recovered-dist/*
          retention-days: 14
          if-no-files-found: error

  establish-release-tag:
    needs: recover-artifacts
    if: inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout trusted recovery automation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Re-prove immutable release tag
        uses: ./.github/actions/release-state
        with:
          mode: establish
          version: ${{ inputs.version }}
          release-sha: ${{ needs.recover-artifacts.outputs.tag_sha }}
          require-existing-tag: true
          halt: ${{ vars.RELEASE_HALT == 'true' }}

  publish-pypi:
    needs: [recover-artifacts, establish-release-tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      # This OIDC-bearing job intentionally remains in publish.yml so an
      # existing PyPI Trusted Publisher registration for the fallback workflow
      # remains valid. The shared composite action removes policy drift without
      # changing the workflow identity PyPI authenticates.
      - name: Checkout trusted recovery publication action
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Download exact recovered distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.recover-artifacts.outputs.artifact_name }}
          path: dist

      - name: Publish canonical PyPI state
        uses: ./.github/actions/pypi-canonical
        with:
          package: furl-ctx
          version: ${{ inputs.version }}
          packages-dir: dist
          halt: ${{ vars.RELEASE_HALT == 'true' }}

  github-release:
    needs: [recover-artifacts, establish-release-tag, publish-pypi]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout trusted recovery release action
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download exact recovered distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.recover-artifacts.outputs.artifact_name }}
          path: dist

      - name: Finalize byte-verified GitHub Release
        uses: ./.github/actions/release-state
        with:
          mode: finalize
          version: ${{ inputs.version }}
          release-sha: ${{ needs.recover-artifacts.outputs.tag_sha }}
          dist-dir: dist
          halt: ${{ vars.RELEASE_HALT == 'true' }}

  summary:
    needs: [recover-artifacts, establish-release-tag, publish-pypi, github-release]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Recovery summary
        run: |
          echo "Recovered artifact source run: ${{ needs.recover-artifacts.outputs.source_run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Immutable tag SHA: ${{ needs.recover-artifacts.outputs.tag_sha }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "Dry run: verified exact sealed release bytes; nothing was published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Tag identity: ${{ needs.establish-release-tag.result }}" >> "$GITHUB_STEP_SUMMARY"
            echo "PyPI canonical publication: ${{ needs.publish-pypi.result }}" >> "$GITHUB_STEP_SUMMARY"
            echo "GitHub Release: ${{ needs.github-release.result }}" >> "$GITHUB_STEP_SUMMARY"
          fi
