name: PR 216 storage safety fix

on:
  push:
    branches:
      - agent/integrate-context-safety-improvements

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/integrate-context-safety-improvements
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply storage-safety patch
        run: python .github/pr216_apply_storage_fix.py
      - name: Format and syntax-check touched Python
        run: |
          python -m pip install 'ruff==0.16.2'
          ruff format \
            furl_ctx/cache/storage_safety.py \
            furl_ctx/cache/backends/memory.py \
            furl_ctx/cache/backends/sqlite.py \
            furl_ctx/cache/compression_store.py \
            furl_ctx/ccr/mcp_server.py
          ruff check --fix \
            furl_ctx/cache/storage_safety.py \
            furl_ctx/cache/backends/memory.py \
            furl_ctx/cache/backends/sqlite.py \
            furl_ctx/cache/compression_store.py \
            furl_ctx/ccr/mcp_server.py
          python -m compileall -q furl_ctx/cache furl_ctx/ccr/mcp_server.py
      - name: Remove one-shot applicator
        run: git rm .github/pr216_apply_storage_fix.py .github/workflows/pr216-storage-safety-fix.yml
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add furl_ctx/cache furl_ctx/ccr/mcp_server.py
          git commit -m 'fix: make CCR storage safety fail closed'
          git push origin HEAD:agent/integrate-context-safety-improvements
