name: perf

# Runs Rust fmt/clippy/test, deterministic regression counters, and performance checks. This workflow is
# non-required, so path filtering is safe; include this file so edits to the gate always exercise it.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/perf.yml"
      - "crates/**"
      - "furl_ctx/**"
      - "pyproject.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "benchmarks/**"
      - "verify/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/perf.yml"
      - "crates/**"
      - "furl_ctx/**"
      - "pyproject.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "benchmarks/**"
      - "verify/**"

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  # Cancel superseded PR runs; never cancel a main build (no wasted signal on
  # PRs, full history of trend on main).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PY_VERSION: "3.12"

jobs:
  rust-checks:
    # Run Rust fmt/clippy/test outside the required PR path; required jobs do not invoke Cargo. Use the same toolchain pins and cache policy.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0 # keep in sync with rust-toolchain.toml
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  perf-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch full history so baseline-bump detection can compare the committed benchmark baseline with `origin/main`.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PY_VERSION }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2
        with:
          workspaces: ". -> target"

      - name: Build wheel (fast CI cargo profile)
        # Use the same fast `ci` Cargo profile as wheel CI with one interpreter and `dist/` output.
        run: |
          python -m pip install --upgrade pip 'maturin>=1.9,<2.0'
          maturin build --profile ci --out dist --interpreter "python${PY_VERSION}"

      - name: Install wheel + measurement deps
        # Install `[dev]` plus google-re2 to match the environment used for committed performance baselines.
        # RE2 is optional at runtime; the benchmark tooling itself does not require pytest or MCP.
        run: |
          python -m pip install --upgrade pip
          WHEEL="$(ls dist/*.whl)"
          pip install "${WHEEL}[dev]" google-re2
          # The in-tree furl_ctx/ source shadows the installed wheel when running from the repo root; copy the compiled
          # Expose the built extension so imports resolve without a second Cargo build.
          SITE="$(python -c 'import sysconfig; print(sysconfig.get_path("platlib"))')"
          cp "${SITE}/furl_ctx/"_core*.so furl_ctx/
          python -c "from furl_ctx._core import DiffCompressor; print('furl_ctx._core OK')"

      - name: Measure PR base commit on the same runner
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_dir="${RUNNER_TEMP}/perf-base"
          base_venv="${RUNNER_TEMP}/perf-base-venv"
          git worktree add --detach "$base_dir" "$BASE_SHA"

          (
            cd "$base_dir"
            python -m pip install --upgrade pip 'maturin>=1.9,<2.0'
            CARGO_TARGET_DIR="${RUNNER_TEMP}/perf-base-target" \
              maturin build --profile ci --out dist --interpreter "python${PY_VERSION}"
            python -m venv "$base_venv"
            "$base_venv/bin/python" -m pip install --upgrade pip
            base_wheel="$(ls dist/*.whl)"
            "$base_venv/bin/pip" install "${base_wheel}[dev]" google-re2
            base_site="$("$base_venv/bin/python" -c 'import sysconfig; print(sysconfig.get_path("platlib"))')"
            cp "${base_site}/furl_ctx/"_core*.so furl_ctx/
            "$base_venv/bin/python" -c "from furl_ctx._core import DiffCompressor; print('base furl_ctx._core OK')"
            "$base_venv/bin/python" -m benchmarks.run_bench --out "${RUNNER_TEMP}/bench-base"
          )

      - name: Tool-regression sweep (verify.run)
        run: |
          set -o pipefail
          python -m verify.run | tee "${RUNNER_TEMP}/verify.out"

      - name: Assert verify.run counters
        # Parse the summary line and assert the pinned counters EXACTLY. verify.run always exits 0, so the gate lives here, not in its return code.
        shell: python
        env:
          VERIFY_OUT: ${{ runner.temp }}/verify.out
        run: |
          import os
          import re
          import sys
          from pathlib import Path

          text = Path(os.environ["VERIFY_OUT"]).read_text(encoding="utf-8")
          summary = [ln for ln in text.splitlines() if ln.startswith("default_params_confirmed=")]
          if not summary:
              sys.exit("verify.run summary line not found in output")
          line = summary[-1]
          expected = {
              "degradations": 6,
              "hash_failures": 0,
              "silent_loss": 0,
              "cache_prefix_violations": 0,
              # The whole-blob CCR offload path is reached by exactly one family (`opaque`) and only while the engine CANNOT compress
              # its documents. A misses-only assertion would let deleting the family remove every cell being checked.
              "opaque_route_runs": 36,
              "opaque_route_taken": 36,
              "opaque_route_misses": 0,
          }
          got: dict[str, int] = {}
          for key in expected:
              match = re.search(rf"\b{key}=(\d+)\b", line)
              if match is None:
                  sys.exit(f"verify.run summary missing counter {key!r}: {line!r}")
              got[key] = int(match.group(1))
          if got != expected:
              sys.exit(f"verify.run regression: expected {expected}, got {got}\nsummary line: {line}")
          print(f"verify.run counters OK: {got}")

      - name: Detect baseline bump
        id: baseline
        # A PR may intentionally re-baseline; detect whether it changed the committed baseline file relative to main.
        run: |
          if git diff --name-only origin/main...HEAD -- benchmarks/baseline_results.json | grep -q .; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "This PR updates benchmarks/baseline_results.json."
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run benchmarks
        run: python -m benchmarks.run_bench --out "${RUNNER_TEMP}/bench-now"

      - name: Compare PR against same-runner base commit
        if: github.event_name == 'pull_request'
        run: |
          python -m benchmarks.compare_baseline \
            --baseline "${RUNNER_TEMP}/bench-base/baseline_results.json" \
            --candidate "${RUNNER_TEMP}/bench-now/baseline_results.json" \
            --markdown-summary "$GITHUB_STEP_SUMMARY"

      - name: Compare against committed baseline floor
        # Nonzero exit on any regression or invalid input fails the job.
        env:
          BASELINE_UPDATED: ${{ steps.baseline.outputs.updated }}
        run: |
          FLAG=""
          if [ "$BASELINE_UPDATED" = "true" ]; then FLAG="--baseline-updated"; fi
          python -m benchmarks.compare_baseline \
            --baseline benchmarks/baseline_results.json \
            --candidate "${RUNNER_TEMP}/bench-now/baseline_results.json" \
            --markdown-summary "$GITHUB_STEP_SUMMARY" $FLAG

      - name: Floor guard — is the floor still the right floor?
        # compare_baseline above answers "did the candidate REGRESS against the floor". An upward floor move is allowed only in a baseline-only
        # PR. Non-blocking by construction: perf is never a required check, so this is a loud alarm on main rather than a merge blocker.
        run: |
          git show origin/main:benchmarks/baseline_results.json \
            > "${RUNNER_TEMP}/floor-main.json"
          git diff --name-only origin/main...HEAD > "${RUNNER_TEMP}/changed-files.txt"
          python -m benchmarks.floor_guard \
            --floor-main "${RUNNER_TEMP}/floor-main.json" \
            --floor-pr benchmarks/baseline_results.json \
            --candidate "${RUNNER_TEMP}/bench-now/baseline_results.json" \
            --changed-files "${RUNNER_TEMP}/changed-files.txt"
