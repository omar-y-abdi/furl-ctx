name: autofix

# Unprivileged mechanical repair proposal for every PR. This workflow executes
# PR-controlled source, so it deliberately receives NO write credential and no
# long-lived AUTOFIX_TOKEN. It creates a reviewable patch artifact only.
# `autofix apply` is a separate default-branch workflow_run bridge. It never
# checks out or executes PR code: it treats this job's candidate artifact as
# hostile data and auto-applies only Python changes it can prove preserve the
# exact AST and security-significant comments.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: autofix-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -Eeuo pipefail {0}

jobs:
  autofix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ github.token }}

      - name: Detect repair scope
        id: scope
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        run: |
          if [[ "$HEAD_REPO" == "$BASE_REPO" ]]; then
            echo "same_repo=true" >> "$GITHUB_OUTPUT"
          else
            echo "same_repo=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply safe automatic fixes
        id: fix
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          retry() {
            local attempts="$1"; shift
            local n=1
            until "$@"; do
              if (( n >= attempts )); then return 1; fi
              sleep $((n * 4))
              n=$((n + 1))
            done
          }

          install_rc=0
          retry 3 python -m pip install --upgrade pip ruff==0.16.2 || install_rc=$?

          ruff_rc=0
          format_rc=0
          rustfmt_rc=0
          if (( install_rc == 0 )); then
            ruff check --fix . || ruff_rc=$?
            ruff format . || format_rc=$?
          else
            ruff_rc="$install_rc"
            format_rc="$install_rc"
          fi
          cargo fmt --all || rustfmt_rc=$?

          {
            echo "## Autofix proposal"
            echo ""
            echo "- Python fixes: exit $ruff_rc"
            echo "- Python formatting: exit $format_rc"
            echo "- Rust formatting: exit $rustfmt_rc"
            echo ""
            echo "This PR-controlled job has read-only credentials. The trusted bridge treats every artifact from this run as hostile data."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the candidate repair
        id: verify
        continue-on-error: true
        run: |
          ruff check .
          ruff format --check .
          cargo fmt --all -- --check

      - name: Detect changes
        id: dirty
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "dirty=true" >> "$GITHUB_OUTPUT"
          else
            echo "dirty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build repair patch
        if: steps.dirty.outputs.dirty == 'true'
        run: |
          git diff --binary > autofix.patch
          test -s autofix.patch

      - name: Upload repair patch
        if: always() && steps.dirty.outputs.dirty == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: autofix-patch-pr-${{ github.event.pull_request.number }}
          path: autofix.patch
          retention-days: 14
          if-no-files-found: error

      - name: Build machine-verifiable candidate payload
        if: >-
          steps.dirty.outputs.dirty == 'true' &&
          steps.verify.outcome == 'success' &&
          steps.scope.outputs.same_repo == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import subprocess

          deleted = [x for x in subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=D", "-z"]
          ).decode().split("\0") if x]
          untracked = [x for x in subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard", "-z"]
          ).decode().split("\0") if x]
          if deleted or untracked:
              raise SystemExit(
                  f"autofix changed unsupported repository shape: deleted={deleted} untracked={untracked}"
              )

          changed = sorted(x for x in subprocess.check_output(
              ["git", "diff", "--name-only", "-z"]
          ).decode().split("\0") if x)
          allowed = {".py", ".pyi", ".rs"}
          root = pathlib.Path("autofix-candidate")
          shutil.rmtree(root, ignore_errors=True)
          files_root = root / "files"
          files_root.mkdir(parents=True)
          entries = []
          for raw in changed:
              path = pathlib.PurePosixPath(raw)
              if (
                  path.is_absolute()
                  or ".." in path.parts
                  or not path.parts
                  or path.parts[0] == ".github"
                  or path.suffix not in allowed
              ):
                  raise SystemExit(f"refusing candidate outside source allowlist: {raw}")
              src = pathlib.Path(raw)
              if not src.is_file():
                  raise SystemExit(f"candidate path is not a regular file: {raw}")
              data = src.read_bytes()
              dest = files_root / raw
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
              entries.append({"path": raw, "sha256": hashlib.sha256(data).hexdigest()})

          manifest = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "pr_number": int(os.environ["PR_NUMBER"]),
              "head_sha": os.environ["HEAD_SHA"],
              "files": entries,
          }
          (root / "manifest.json").write_text(
              json.dumps(manifest, sort_keys=True, indent=2) + "\n"
          )
          print(f"Prepared {len(entries)} candidate source file(s) for hostile-data verification.")
          PY

      - name: Upload machine-verifiable candidate payload
        if: >-
          steps.dirty.outputs.dirty == 'true' &&
          steps.verify.outcome == 'success' &&
          steps.scope.outputs.same_repo == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: autofix-candidate-pr-${{ github.event.pull_request.number }}
          path: autofix-candidate/
          retention-days: 1
          if-no-files-found: error

      - name: Final summary
        if: always()
        run: |
          if [[ "${{ steps.verify.outcome }}" != "success" ]]; then
            echo "The candidate did not pass every mechanical verification check. CI remains authoritative; any patch is inspection-only." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ steps.dirty.outputs.dirty }}" != "true" ]]; then
            echo "No mechanical fixes were needed; the autofix-owned checks already pass." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ steps.scope.outputs.same_repo }}" == "true" ]]; then
            echo "A verified patch and candidate payload were produced. The trusted bridge may auto-apply only AST-preserving Python formatting; Rust or semantic lint fixes remain patch-only." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "A verified patch was produced for this fork PR. It is never auto-pushed because fork-controlled code receives no write path." >> "$GITHUB_STEP_SUMMARY"
          fi
