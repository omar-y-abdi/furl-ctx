name: autofix

# Unprivileged mechanical repair proposal for every PR. This workflow executes
# PR-controlled source, so it deliberately receives NO write credential and no
# long-lived AUTOFIX_TOKEN. It creates a reviewable patch artifact only.
# `autofix apply` is a separate default-branch workflow_run bridge: it
# independently regenerates the same repair, verifies the unchanged same-repo
# PR head, sanitizes the changed-file payload, and only then uses the write
# credential without ever executing PR code in the privileged job.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: autofix-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -Eeuo pipefail {0}

jobs:
  autofix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head without persistent credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ github.token }}

      - name: Detect repair scope
        id: scope
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        run: |
          if [[ "$HEAD_REPO" == "$BASE_REPO" ]]; then
            echo "same_repo=true" >> "$GITHUB_OUTPUT"
          else
            echo "same_repo=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply safe automatic fixes
        id: fix
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          retry() {
            local attempts="$1"; shift
            local n=1
            until "$@"; do
              if (( n >= attempts )); then return 1; fi
              sleep $((n * 4))
              n=$((n + 1))
            done
          }

          install_rc=0
          retry 3 python -m pip install --upgrade pip ruff==0.16.2 || install_rc=$?

          ruff_rc=0
          format_rc=0
          rustfmt_rc=0
          if (( install_rc == 0 )); then
            ruff check --fix . || ruff_rc=$?
            ruff format . || format_rc=$?
          else
            ruff_rc="$install_rc"
            format_rc="$install_rc"
          fi
          cargo fmt --all || rustfmt_rc=$?

          {
            echo "## Autofix proposal"
            echo ""
            echo "- Python fixes: exit $ruff_rc"
            echo "- Python formatting: exit $format_rc"
            echo "- Rust formatting: exit $rustfmt_rc"
            echo ""
            echo "This PR-controlled job has read-only credentials. Any same-repo auto-application is independently regenerated by the trusted autofix-apply bridge."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the candidate repair
        id: verify
        continue-on-error: true
        run: |
          ruff check .
          ruff format --check .
          cargo fmt --all -- --check

      - name: Detect changes
        id: dirty
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "dirty=true" >> "$GITHUB_OUTPUT"
          else
            echo "dirty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build repair patch
        if: steps.dirty.outputs.dirty == 'true'
        run: |
          git diff --binary > autofix.patch
          test -s autofix.patch

      - name: Upload repair patch
        if: always() && steps.dirty.outputs.dirty == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: autofix-patch-pr-${{ github.event.pull_request.number }}
          path: autofix.patch
          retention-days: 14
          if-no-files-found: error

      - name: Final summary
        if: always()
        run: |
          if [[ "${{ steps.verify.outcome }}" != "success" ]]; then
            echo "The candidate did not pass every mechanical verification check. CI remains authoritative; any patch is inspection-only." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ steps.dirty.outputs.dirty }}" != "true" ]]; then
            echo "No mechanical fixes were needed; the autofix-owned checks already pass." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ steps.scope.outputs.same_repo }}" == "true" ]]; then
            echo "A verified patch was produced. The trusted autofix-apply workflow will independently regenerate and apply it only if the PR head is still unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "A verified patch was produced for this fork PR. It is never auto-pushed because fork-controlled code receives no write path." >> "$GITHUB_STEP_SUMMARY"
          fi
