name: autofix

# Safe mechanical repair pass for every PR. Same-repo PRs can be repaired in
# place when AUTOFIX_TOKEN exists; fork PRs never receive secrets and instead
# get a patch artifact they can apply themselves.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: autofix-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -Eeuo pipefail {0}

jobs:
  autofix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.AUTOFIX_TOKEN || github.token }}

      - name: Detect repair mode
        id: scope
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          AUTOFIX_TOKEN: ${{ secrets.AUTOFIX_TOKEN }}
        run: |
          if [[ "$HEAD_REPO" == "$BASE_REPO" ]]; then
            echo "same_repo=true" >> "$GITHUB_OUTPUT"
          else
            echo "same_repo=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$AUTOFIX_TOKEN" ]]; then
            echo "token=true" >> "$GITHUB_OUTPUT"
          else
            echo "token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply safe automatic fixes
        id: fix
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          retry() {
            local attempts="$1"; shift
            local n=1
            until "$@"; do
              if (( n >= attempts )); then return 1; fi
              sleep $((n * 4))
              n=$((n + 1))
            done
          }

          install_rc=0
          retry 3 python -m pip install --upgrade pip ruff==0.16.2 || install_rc=$?

          ruff_rc=0
          format_rc=0
          rustfmt_rc=0
          if (( install_rc == 0 )); then
            ruff check --fix . || ruff_rc=$?
            ruff format . || format_rc=$?
          else
            ruff_rc="$install_rc"
            format_rc="$install_rc"
          fi
          cargo fmt --all || rustfmt_rc=$?

          {
            echo "## Autofix pass"
            echo ""
            echo "- Python fixes: exit $ruff_rc"
            echo "- Python formatting: exit $format_rc"
            echo "- Rust formatting: exit $rustfmt_rc"
            echo ""
            echo "Any remaining problem is left for CI to report; this repair job still preserves any fixes it could make."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the candidate repair
        id: verify
        continue-on-error: true
        run: |
          # Autofix may only push changes that make every mechanical check it
          # owns pass. Unfixable lint/type/test failures remain CI's job and are
          # never papered over by a partial formatting commit.
          ruff check .
          ruff format --check .
          cargo fmt --all -- --check

      - name: Detect changes
        id: dirty
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "dirty=true" >> "$GITHUB_OUTPUT"
          else
            echo "dirty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build repair patch
        if: steps.dirty.outputs.dirty == 'true'
        run: |
          git diff --binary > autofix.patch
          test -s autofix.patch

      - name: Commit and push repair
        id: push
        continue-on-error: true
        if: >-
          steps.dirty.outputs.dirty == 'true' &&
          steps.verify.outcome == 'success' &&
          steps.scope.outputs.same_repo == 'true' &&
          steps.scope.outputs.token == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          AUTOFIX_TOKEN: ${{ secrets.AUTOFIX_TOKEN }}
        run: |
          git config user.name "furl-autofix"
          git config user.email "furl-autofix@users.noreply.github.com"
          git add -u
          git commit -m "ci: autofix formatting and lint"
          git remote set-url origin "https://x-access-token:${AUTOFIX_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # A normal push already rejects most races, but compare the remote ref
          # explicitly so a force-reset/rewrite cannot make an old repair commit
          # look like a legitimate fast-forward.
          remote_head="$(git ls-remote origin "refs/heads/${HEAD_REF}" | awk '{print $1}')"
          if [[ "$remote_head" != "$EXPECTED_HEAD" ]]; then
            echo "PR head moved from $EXPECTED_HEAD to ${remote_head:-<missing>}; refusing to push a stale repair." >&2
            exit 1
          fi

          retry() {
            local n=1
            until "$@"; do
              [[ "$n" == "3" ]] && return 1
              sleep $((n * 5))
              n=$((n + 1))
            done
          }
          # A normal push is intentional: never overwrite a newer PR commit.
          # Transient network/API failures are retried; a real race falls back
          # to the patch artifact and the newer synchronize run takes over.
          retry git push origin "HEAD:${HEAD_REF}"

      - name: Upload repair patch
        if: >-
          always() &&
          steps.dirty.outputs.dirty == 'true' &&
          (
            steps.verify.outcome != 'success' ||
            steps.scope.outputs.same_repo != 'true' ||
            steps.scope.outputs.token != 'true' ||
            steps.push.outcome == 'failure'
          )
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: autofix-patch-pr-${{ github.event.pull_request.number }}
          path: autofix.patch
          retention-days: 14
          if-no-files-found: error

      - name: Final summary
        if: always()
        run: |
          if [[ "${{ steps.verify.outcome }}" != "success" ]]; then
            echo "Autofix produced no push: the candidate did not pass every mechanical verification check. Any patch was preserved for inspection." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ steps.dirty.outputs.dirty }}" != "true" ]]; then
            echo "No mechanical fixes were needed; the autofix-owned checks already pass." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ steps.push.outcome }}" == "success" ]]; then
            echo "A verified repair was pushed back to the unchanged PR head." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Verified fixes were saved as an autofix patch artifact because a safe push was unavailable." >> "$GITHUB_STEP_SUMMARY"
          fi
