name: chatgpt-pr216-publish-final

on:
  push:
    branches: ["chatgpt/pr216-publish-final-20260911"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify exact transport and publish isolated validation branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum .chatgpt-pr216/part00 | awk '{print $1}')" = "4533f625e487a1def67d67ec578579972e17d3ee479bc67971b4ba2703036982"
          test "$(sha256sum .chatgpt-pr216/part01 | awk '{print $1}')" = "823c826108e665c97d944d62bf29e423cd278482cd9c0878e638b5a7c7a3bc5a"
          test "$(sha256sum .chatgpt-pr216/part02 | awk '{print $1}')" = "29d5de935477d433560305b4097745af55d5f3abb8966db9aac5957f9a84fad5"
          test "$(sha256sum .chatgpt-pr216/part03 | awk '{print $1}')" = "725eea103bf7d60ed601392a831f4f57f9946809a8458fb27d858fe506d19550"
          test "$(sha256sum .chatgpt-pr216/part04 | awk '{print $1}')" = "9544771c00950cf1498690a2ddc9fa2634a23a51ec74c36a02bcee4b62fa11fd"
          test "$(sha256sum .chatgpt-pr216/part05 | awk '{print $1}')" = "f5b3dfae2d0ee4b0c38f6f9bb4bf278dd2700bbbc8fa243a0fe90cbff92201a9"
          test "$(sha256sum .chatgpt-pr216/part06 | awk '{print $1}')" = "71ef6cd8571034b38d72b323dea25e85f9d8497c8bab23ac22d8ee5215eeded1"
          test "$(sha256sum .chatgpt-pr216/part07a | awk '{print $1}')" = "a9db18c7c68d481b0d86397820600e7bbef656edb737a6fc9bb1bde446cb418e"
          test "$(sha256sum .chatgpt-pr216/part07b | awk '{print $1}')" = "d2e8c77b2c83a2242e033afd334e37825dd47a7d2e004a0bef37abb36fda98d0"
          test "$(sha256sum .chatgpt-pr216/part07c | awk '{print $1}')" = "ce0078925eb265378be6adf5fed320c65f5ed7473915a5c63a1f165dac6c08ce"
          test "$(sha256sum .chatgpt-pr216/part07d | awk '{print $1}')" = "5b1e716dde93195a11eed0e3268604e1ea8c1885237ad6af973956e6a439957e"
          test "$(sha256sum .chatgpt-pr216/part08 | awk '{print $1}')" = "08f551a234ae03c69cadd377a8f4bf2174fd10b2076c00d77586174d8a282959"

          cat \
            .chatgpt-pr216/part00 \
            .chatgpt-pr216/part01 \
            .chatgpt-pr216/part02 \
            .chatgpt-pr216/part03 \
            .chatgpt-pr216/part04 \
            .chatgpt-pr216/part05 \
            .chatgpt-pr216/part06 \
            .chatgpt-pr216/part07a \
            .chatgpt-pr216/part07b \
            .chatgpt-pr216/part07c \
            .chatgpt-pr216/part07d \
            .chatgpt-pr216/part08 > /tmp/pr216.b64
          test "$(sha256sum /tmp/pr216.b64 | awk '{print $1}')" = "d0b6020a98db87f6429374c85c639a43670810c8fcc31fa422520ed0a2fc0e53"
          base64 -d /tmp/pr216.b64 > /tmp/pr216.patch
          test "$(sha256sum /tmp/pr216.patch | awk '{print $1}')" = "d2771cf90dc5bf2b589e95b909b6f0e202f98ebc8c9b97710172d12318cbaba9"

          git checkout --detach 7345a29da1aae1c874eb021a8b56929c179d17ab
          git apply --index /tmp/pr216.patch
          tree="$(git write-tree)"
          test "$tree" = "2075d70f0a9a92d2af38a720c44838273fe00243"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: close remaining PR 216 storage safety gaps"
          test "$(git rev-parse HEAD^{tree})" = "2075d70f0a9a92d2af38a720c44838273fe00243"
          git push origin HEAD:refs/heads/chatgpt/pr216-validate-final-20260911
