name: chatgpt-pr216-bundle2

on:
  push:
    branches:
      - chatgpt/pr216-bundle2-20260911

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --all --tags --prune
      - run: |
          git bundle create repo.bundle --all
          git bundle verify repo.bundle
      - uses: actions/upload-artifact@v4
        with:
          name: pr216-repo-bundle2
          path: repo.bundle
          retention-days: 1
