name: PR 216 compatibility-safe storage correction

on:
  push:
    branches:
      - agent/integrate-context-safety-improvements

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/integrate-context-safety-improvements
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply correction
        run: python .github/pr216_apply_compat_safety_fix.py
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,mcp,code]' pytest-split google-re2
      - name: Static verification
        run: |
          ruff format \
            furl_ctx/cache/backends/memory.py \
            furl_ctx/cache/backends/sqlite.py \
            furl_ctx/cache/compression_store.py \
            furl_ctx/ccr/mcp_server.py \
            tests/test_compression_store_review_regressions.py
          ruff check --fix \
            furl_ctx/cache/backends/memory.py \
            furl_ctx/cache/backends/sqlite.py \
            furl_ctx/cache/compression_store.py \
            furl_ctx/ccr/mcp_server.py \
            tests/test_compression_store_review_regressions.py
          mypy furl_ctx --ignore-missing-imports
          python -m compileall -q furl_ctx/cache furl_ctx/ccr/mcp_server.py
      - name: Focused behavioral verification
        run: |
          pytest -q --tb=short \
            tests/test_compression_store_review_regressions.py \
            tests/test_pr216_transient_cascade_safety.py \
            tests/test_pr216_binding_persistence.py \
            tests/test_pr216_binding_concurrency.py \
            tests/test_storage_safety.py \
            tests/test_ccr_hash_collision_drop.py \
            tests/test_ccr_spill_tier.py \
            tests/test_store_concurrency.py \
            tests/test_mcp_offloop_invariant.py \
            tests/test_mcp_purge.py \
            tests/test_mcp_server_handlers.py \
            tests/test_purge_cascade_sharing.py
      - name: Remove one-shot machinery
        run: git rm .github/pr216_apply_compat_safety_fix.py .github/workflows/pr216-compat-safety-fix.yml
      - name: Commit verified correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add furl_ctx tests/test_compression_store_review_regressions.py
          git commit -m 'fix: separate storage proof from availability'
          git push origin HEAD:agent/integrate-context-safety-improvements
