name: Apply Codex review fix

on:
  push:
    branches:
      - agent/integrate-context-safety-improvements

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: run guarded codex replacements' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/integrate-context-safety-improvements
          fetch-depth: 1
      - name: Apply assertion-guarded replacements
        shell: bash
        run: |
          set -euo pipefail
          python .codex-review-fix.py
          git diff --check
          python -m py_compile furl_ctx/cache/compression_store.py tests/test_compression_store_review_regressions.py
          git rm .codex-review-fix.patch .codex-review-fix.py .github/workflows/apply-codex-review-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add furl_ctx tests
          git commit -m 'fix: address codex review blockers'
          git push origin HEAD:agent/integrate-context-safety-improvements
