name: PR 216 storage type-contract fix

on:
  push:
    branches:
      - agent/integrate-context-safety-improvements

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/integrate-context-safety-improvements
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply narrow type-contract fix
        run: python .github/pr216_apply_typefix.py
      - name: Verify Python gates
        run: |
          python -m pip install 'ruff==0.16.2' 'mypy==1.14.1'
          ruff check furl_ctx/cache/compression_store.py
          ruff format --check furl_ctx/cache/compression_store.py
          mypy furl_ctx --ignore-missing-imports
          python -m compileall -q furl_ctx/cache furl_ctx/ccr/mcp_server.py
      - name: Remove one-shot helper
        run: git rm .github/pr216_apply_typefix.py .github/workflows/pr216-storage-typefix.yml
      - name: Commit verified source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add furl_ctx/cache/compression_store.py
          git commit -m 'fix: satisfy storage safety type contracts'
          git push origin HEAD:agent/integrate-context-safety-improvements
