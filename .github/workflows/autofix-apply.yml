name: autofix apply

# Privilege-separated autofix bridge. The prepare job is allowed to inspect and
# format the untrusted PR head but has read-only permissions and no secrets. The
# apply job never checks out or executes PR code; it accepts only a sanitized
# manifest of .py/.pyi/.rs file bytes generated by prepare, revalidates the live
# PR head, and writes a normal fast-forward commit via GitHub's Git Data API.
on:
  workflow_run:
    workflows: [autofix]
    types: [completed]

permissions: {}

defaults:
  run:
    shell: bash -Eeuo pipefail {0}

concurrency:
  group: autofix-apply-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  prepare:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.pr.outputs.eligible }}
      dirty: ${{ steps.payload.outputs.dirty == 'true' && 'true' || 'false' }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      artifact_name: ${{ steps.payload.outputs.artifact_name }}
    steps:
      - name: Resolve unchanged same-repository PR head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          data="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          state="$(jq -r '.state' <<<"$data")"
          base_ref="$(jq -r '.base.ref' <<<"$data")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$data")"
          head_ref="$(jq -r '.head.ref' <<<"$data")"
          head_sha="$(jq -r '.head.sha' <<<"$data")"

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

          if [[ "$state" != "open" || "$base_ref" != "main" || "$head_repo" != "$GITHUB_REPOSITORY" || "$head_sha" != "$SOURCE_SHA" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "PR #${PR_NUMBER} is forked, closed, retargeted, or moved since source run ${SOURCE_SHA}; refusing autonomous application." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Checkout exact PR head without persistent credentials
        if: steps.pr.outputs.eligible == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ github.token }}

      - name: Set up Python
        if: steps.pr.outputs.eligible == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Rust toolchain
        if: steps.pr.outputs.eligible == 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Regenerate mechanical repair
        if: steps.pr.outputs.eligible == 'true'
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          retry() {
            local n=1
            until "$@"; do
              [[ "$n" == "3" ]] && return 1
              sleep $((n * 4))
              n=$((n + 1))
            done
          }
          install_rc=0
          retry python -m pip install --upgrade pip ruff==0.16.2 || install_rc=$?
          if (( install_rc == 0 )); then
            ruff check --fix . || true
            ruff format . || true
          fi
          cargo fmt --all || true

      - name: Verify regenerated candidate
        id: verify
        if: steps.pr.outputs.eligible == 'true'
        continue-on-error: true
        run: |
          ruff check .
          ruff format --check .
          cargo fmt --all -- --check

      - name: Build sanitized trusted payload
        id: payload
        if: steps.pr.outputs.eligible == 'true' && steps.verify.outcome == 'success'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import subprocess

          deleted = subprocess.check_output(["git", "diff", "--name-only", "--diff-filter=D", "-z"]).decode().split("\0")
          deleted = [x for x in deleted if x]
          untracked = subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard", "-z"]).decode().split("\0")
          untracked = [x for x in untracked if x]
          if deleted or untracked:
              raise SystemExit(f"autofix changed unsupported repository shape: deleted={deleted} untracked={untracked}")

          changed = subprocess.check_output(["git", "diff", "--name-only", "-z"]).decode().split("\0")
          changed = sorted(x for x in changed if x)
          if not changed:
              pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a").write("dirty=false\n")
              print("No trusted autofix payload is needed.")
              raise SystemExit(0)

          allowed = {".py", ".pyi", ".rs"}
          for raw in changed:
              path = pathlib.PurePosixPath(raw)
              if path.is_absolute() or ".." in path.parts or path.suffix not in allowed or path.parts[0] == ".github":
                  raise SystemExit(f"refusing autofix write outside allowlisted source types: {raw}")

          root = pathlib.Path("trusted-autofix-payload")
          shutil.rmtree(root, ignore_errors=True)
          files_root = root / "files"
          files_root.mkdir(parents=True)
          entries = []
          for raw in changed:
              src = pathlib.Path(raw)
              stage = subprocess.check_output(["git", "ls-files", "-s", "--", raw], text=True).strip()
              if not stage:
                  raise SystemExit(f"changed file is not tracked: {raw}")
              mode = stage.split()[0]
              if mode not in {"100644", "100755"}:
                  raise SystemExit(f"unsupported git mode for {raw}: {mode}")
              data = src.read_bytes()
              dest = files_root / raw
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
              entries.append({"path": raw, "mode": mode, "sha256": hashlib.sha256(data).hexdigest()})

          manifest = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "pr_number": int(os.environ["PR_NUMBER"]),
              "head_ref": os.environ["HEAD_REF"],
              "head_sha": os.environ["HEAD_SHA"],
              "files": entries,
          }
          (root / "manifest.json").write_text(json.dumps(manifest, sort_keys=True, indent=2) + "\n")
          artifact = f"trusted-autofix-pr-{manifest['pr_number']}-{manifest['head_sha']}"
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a") as fh:
              fh.write("dirty=true\n")
              fh.write(f"artifact_name={artifact}\n")
          print(f"Sanitized {len(entries)} changed source file(s) for privileged application.")
          PY

      - name: Explain non-actionable candidate
        if: steps.pr.outputs.eligible != 'true' || steps.verify.outcome != 'success'
        run: |
          if [[ "${{ steps.pr.outputs.eligible }}" == "true" ]]; then
            echo "Regenerated autofix did not pass every mechanical check; refusing to push and leaving CI authoritative." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload trusted sanitized payload
        if: steps.payload.outputs.dirty == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.payload.outputs.artifact_name }}
          path: trusted-autofix-payload/
          retention-days: 1
          if-no-files-found: error

  apply:
    needs: prepare
    if: needs.prepare.outputs.dirty == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Download trusted sanitized payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: payload

      - name: Revalidate payload and live PR head without write token
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          EXPECTED_HEAD: ${{ needs.prepare.outputs.head_sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          root = pathlib.Path("payload")
          manifest = json.loads((root / "manifest.json").read_text())
          if manifest["repository"] != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("payload repository mismatch")
          if str(manifest["pr_number"]) != os.environ["PR_NUMBER"] or manifest["head_sha"] != os.environ["EXPECTED_HEAD"]:
              raise SystemExit("payload PR/head identity mismatch")
          allowed = {".py", ".pyi", ".rs"}
          for entry in manifest["files"]:
              pure = pathlib.PurePosixPath(entry["path"])
              if pure.is_absolute() or ".." in pure.parts or pure.suffix not in allowed or pure.parts[0] == ".github":
                  raise SystemExit(f"unsafe payload path: {entry['path']}")
              if entry["mode"] not in {"100644", "100755"}:
                  raise SystemExit(f"unsafe mode for {entry['path']}: {entry['mode']}")
              data = (root / "files" / entry["path"]).read_bytes()
              if hashlib.sha256(data).hexdigest() != entry["sha256"]:
                  raise SystemExit(f"payload digest mismatch: {entry['path']}")
          print(f"Trusted payload integrity OK for {len(manifest['files'])} source file(s).")
          PY

          data="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          [[ "$(jq -r '.state' <<<"$data")" == "open" ]]
          [[ "$(jq -r '.base.ref' <<<"$data")" == "main" ]]
          [[ "$(jq -r '.head.repo.full_name // ""' <<<"$data")" == "$GITHUB_REPOSITORY" ]]
          [[ "$(jq -r '.head.sha' <<<"$data")" == "$EXPECTED_HEAD" ]]

      - name: Fast-forward sanitized repair via Git Data API
        env:
          AUTOFIX_TOKEN: ${{ secrets.AUTOFIX_TOKEN }}
          EXPECTED_HEAD: ${{ needs.prepare.outputs.head_sha }}
        run: |
          if [[ -z "$AUTOFIX_TOKEN" ]]; then
            echo "::warning::AUTOFIX_TOKEN is not configured; the unprivileged autofix patch remains available, but no autonomous write is attempted."
            exit 0
          fi
          python - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.parse
          import urllib.request

          root = pathlib.Path("payload")
          manifest = json.loads((root / "manifest.json").read_text())
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["AUTOFIX_TOKEN"]
          expected = os.environ["EXPECTED_HEAD"]
          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")

          def request(method, path, payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  api + path,
                  data=body,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.load(response) if response.length != 0 else {}
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", "replace")
                  raise SystemExit(f"GitHub API {method} {path} failed: HTTP {exc.code}: {detail}") from exc

          ref_path = "/repos/{}/git/ref/heads/{}".format(repo, urllib.parse.quote(manifest["head_ref"], safe="/"))
          ref = request("GET", ref_path)
          if ref["object"]["sha"] != expected:
              raise SystemExit(f"PR branch moved before write: {ref['object']['sha']} != {expected}")

          parent = request("GET", f"/repos/{repo}/git/commits/{expected}")
          tree_entries = []
          for entry in manifest["files"]:
              data = (root / "files" / entry["path"]).read_bytes()
              blob = request("POST", f"/repos/{repo}/git/blobs", {
                  "content": base64.b64encode(data).decode(),
                  "encoding": "base64",
              })
              tree_entries.append({
                  "path": entry["path"],
                  "mode": entry["mode"],
                  "type": "blob",
                  "sha": blob["sha"],
              })

          tree = request("POST", f"/repos/{repo}/git/trees", {
              "base_tree": parent["tree"]["sha"],
              "tree": tree_entries,
          })
          commit = request("POST", f"/repos/{repo}/git/commits", {
              "message": "ci: autofix formatting and lint",
              "tree": tree["sha"],
              "parents": [expected],
              "author": {"name": "furl-autofix", "email": "furl-autofix@users.noreply.github.com"},
              "committer": {"name": "furl-autofix", "email": "furl-autofix@users.noreply.github.com"},
          })

          # `force: false` is the final race barrier. If the PR advanced after
          # revalidation, GitHub rejects this non-fast-forward update instead of
          # overwriting contributor work; the newer synchronize event takes over.
          request("PATCH", "/repos/{}/git/refs/heads/{}".format(repo, urllib.parse.quote(manifest["head_ref"], safe="/")), {
              "sha": commit["sha"],
              "force": False,
          })
          print(f"Applied verified autofix commit {commit['sha']} on top of {expected}.")
          PY
