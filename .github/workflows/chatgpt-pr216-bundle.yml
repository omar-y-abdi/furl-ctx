name: chatgpt-pr216-bundle

on:
  push:
    branches:
      - chatgpt/pr216-bundle-20260911

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch all refs
        run: git fetch --all --tags --prune
      - name: Create and verify bundle
        run: |
          git bundle create repo.bundle --all
          git bundle verify repo.bundle
      - uses: actions/upload-artifact@v4
        with:
          name: pr216-repo-bundle
          path: repo.bundle
          retention-days: 1
