name: CI

# Parallel CI: path filtering skips heavy work for docs-only changes; one Rust-extension wheel artifact feeds
# lint and four pytest shards on fresh runners. Commit-message checks remain separate from code-gated work.

on:
  # PRs are the merge gate. Main pushes and a daily scheduled pass re-check the repository
  # after merges and catch runner/toolchain drift even when no pull request is open.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force_full:
        description: "Run every expensive check"
        type: boolean
        default: true

permissions:
  contents: read
  # paths-filter (the `changes` gate) and commitlint both read PR metadata via the API on pull_request events; without this
  # every PR run fails the gate with "Resource not accessible by integration" and all real jobs (lint/test/build) are skipped.
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but preserve every main/scheduled validation.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash -Eeuo pipefail {0}

env:
  PY_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_DEFAULT_TIMEOUT: "120"
  PIP_RETRIES: "5"
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      # Non-PR runs are always full runs. PRs may skip expensive work when the
      # diff cannot affect code, while the required jobs still conclude.
      code: ${{ github.event_name != 'pull_request' || inputs.force_full == true || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            code:
              - 'furl_ctx/**'
              - 'crates/**'
              - '**/*.rs'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.release-please-manifest.json'
              - '.release-please-config.json'
              - 'tests/**'
              - 'scripts/**'
              # Top-level packages the SUITE IMPORTS, and the suite's own root config. Omitting them meant a PR touching only these skipped
              # every heavy step so the tests that would have caught it never ran. adding paths can only make `code` true MORE often, never less
              - 'verify/**'
              - 'benchmarks/**'
              - 'conftest.py'
              # Conclusion of the required checks (lint/build-wheel/test) no longer depends on this filter: those jobs ALWAYS run and short- circuit their
              # heavy steps when code=='false' (step-level `if` in each job), so every PR — regardless of diff shape CONCLUDES on all six required contexts.
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'plugins/**'
              - '.agents/**'
              - '.claude-plugin/**'
              - '**/*.md'

  lint:
    # Required check — always runs so it CONCLUDES on every PR (ruleset 18484290); the heavy steps below
    # short-circuit when code=='false', so a docs/config-only PR still concludes SUCCESS in seconds.
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PY_VERSION }}
      - name: Enforce one audited SHA per external action
        shell: python
        run: |
          import collections
          import pathlib
          import re

          uses_re = re.compile(r"\buses:\s*([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)@([0-9a-f]{40})\b")
          pins = collections.defaultdict(lambda: collections.defaultdict(list))
          paths = set(pathlib.Path(".github").rglob("*.yml")) | set(pathlib.Path(".github").rglob("*.yaml"))
          for path in sorted(paths):
              for lineno, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  match = uses_re.search(line)
                  if match:
                      action, sha = match.groups()
                      pins[action][sha].append(f"{path}:{lineno}")

          drift = {action: shas for action, shas in pins.items() if len(shas) > 1}
          if drift:
              details = []
              for action, shas in sorted(drift.items()):
                  details.append(action)
                  for sha, locations in sorted(shas.items()):
                      details.append(f"  {sha}: {', '.join(locations)}")
              raise SystemExit("external action SHA drift detected:\n" + "\n".join(details))
          print(f"External action pins are repository-consistent across {len(pins)} action(s).")
      # Runs unconditionally because agent-orientation edits do not trip the code filter; fail when no anchored documentation links remain.
      - name: llms.txt anchor guard
        shell: python
        run: |
          import re
          import sys
          from pathlib import Path

          llms_txt = Path("llms.txt").read_text(encoding="utf-8")
          # Documentation targets referenced by anchored agent-orientation links.
          doc_names = ("README.md", "LIBRARY.md")

          heading_re = re.compile(r"^#{1,6}\s+(.+?)\s*$")
          slug_strip_re = re.compile(r"[^\w\- ]")
          anchor_ref_re = re.compile(
              "(" + "|".join(re.escape(name) for name in doc_names) + ")#([A-Za-z0-9_-]+)"
          )


          def github_slug(heading_text):
              """Reproduce GitHub's heading-to-anchor slug algorithm."""
              slug = heading_text.strip().lower()
              slug = slug_strip_re.sub("", slug)
              return slug.replace(" ", "-")


          def anchor_slugs(markdown):
              """Every anchor GitHub would generate for a document's headings."""
              slugs = set()
              seen = {}
              in_fence = False
              for line in markdown.splitlines():
                  stripped = line.strip()
                  if stripped.startswith("```") or stripped.startswith("~~~"):
                      in_fence = not in_fence
                      continue
                  if in_fence:
                      continue
                  heading = heading_re.match(line)
                  if heading is None:
                      continue
                  base = github_slug(heading.group(1))
                  count = seen.get(base, 0)
                  seen[base] = count + 1
                  slugs.add(base if count == 0 else f"{base}-{count}")
              return slugs


          slugs_by_doc = {
              name: anchor_slugs(Path(name).read_text(encoding="utf-8")) for name in doc_names
          }
          refs = anchor_ref_re.findall(llms_txt)
          if not refs:
              print("llms.txt contains no README.md#.../LIBRARY.md#... anchor references at")
              print("all — this guard would pass vacuously. If removing the last anchored doc")
              print("link is deliberate, update this step and tests/test_llms_txt_anchors.py")
              print("together.")
              sys.exit(1)
          missing = sorted({f"{doc}#{anchor}" for doc, anchor in refs if anchor not in slugs_by_doc[doc]})
          if missing:
              print("llms.txt references anchors that do not exist in their target file:")
              for ref in missing:
                  print(f"  - {ref}")
              for doc in doc_names:
                  print(f"Valid {doc} anchors: {sorted(slugs_by_doc[doc])}")
              sys.exit(1)
          print(f"OK: {len(refs)} anchor reference(s) in llms.txt all resolve.")
      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-lint-
      - if: needs.changes.outputs.code == 'true'
        run: python -m pip install --upgrade pip ruff==0.16.2 mypy==1.14.1
      - name: ruff check
        id: ruff_check
        continue-on-error: true
        if: needs.changes.outputs.code == 'true'
        run: ruff check .
      - name: ruff format --check
        id: ruff_format
        continue-on-error: true
        if: needs.changes.outputs.code == 'true'
        run: ruff format --check .
      - name: mypy
        id: mypy
        continue-on-error: true
        if: needs.changes.outputs.code == 'true'
        run: mypy furl_ctx --ignore-missing-imports
      - name: Enforce lint results
        if: needs.changes.outputs.code == 'true'
        run: |
          failed=0
          [[ "${{ steps.ruff_check.outcome }}" == "success" ]] || failed=1
          [[ "${{ steps.ruff_format.outcome }}" == "success" ]] || failed=1
          [[ "${{ steps.mypy.outcome }}" == "success" ]] || failed=1
          exit "$failed"

  build-wheel:
    # Required check — always runs so it CONCLUDES on every PR (ruleset 18484290); the heavy steps below
    # short-circuit when code=='false', so a docs/config-only PR still concludes SUCCESS in seconds.
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PY_VERSION }}
      # Pin the action toolchain to the project toolchain; `RUSTUP_TOOLCHAIN` overrides local toolchain selection, so `@stable` would create CI drift.
      - if: needs.changes.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0  # keep in sync with rust-toolchain.toml
      - if: needs.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2
        with:
          workspaces: ". -> target"
      - name: Build wheel once (fast CI cargo profile)
        if: needs.changes.outputs.code == 'true'
        run: |
          python -m pip install --upgrade pip 'maturin>=1.9,<2.0'
          maturin build --profile ci --out dist --interpreter "python${PY_VERSION}"
      - if: needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: furl-wheel
          path: dist/*.whl
          retention-days: 1
          if-no-files-found: error

  test:
    # Required checks test (1..4) — always run so each shard CONCLUDES on every PR (ruleset 18484290); the
    # heavy steps below short-circuit when code=='false', so a docs/config-only PR concludes SUCCESS in seconds.
    needs: [changes, build-wheel]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # FURL_RELEASE_PR_CONTEXT arms the release-manifest/tag exception only for an authenticated Release Please PR. Branch naming alone is not
    # authority: the PR must be same-repository, authored by the exact GITHUB_TOKEN bot, and use Release Please's canonical branch prefix.
    env:
      FURL_RELEASE_PR_CONTEXT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'github-actions[bot]' && startsWith(github.head_ref, 'release-please--') && '1' || '' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # Fetch tags so the release-manifest guard can compare metadata with real Git tags.
      # A shallow checkout has no tags, which would make the guard skip verification.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PY_VERSION }}

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ env.PY_VERSION }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-${{ env.PY_VERSION }}-

      - name: Download prebuilt wheel
        if: needs.changes.outputs.code == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: furl-wheel
          path: dist

      - name: Install (prebuilt wheel + dev deps, no cargo rebuild)
        if: needs.changes.outputs.code == 'true'
        run: |
          python -m pip install --upgrade pip
          WHEEL="$(ls dist/*.whl)"
          # Install dev, MCP, code, and RE2 dependencies explicitly so optional MCP, tree-sitter, and regex-budget suites cannot silently skip if extras change.
          pip install "${WHEEL}[dev,mcp,code]" pytest-split google-re2
          # cwd's ./furl_ctx source tree shadows the installed wheel; copy the
          # compiled extension in so tests import it (no second cargo build).
          SITE="$(python -c 'import sysconfig; print(sysconfig.get_path("platlib"))')"
          cp "${SITE}/furl_ctx/"_core*.so furl_ctx/
          python -c "from furl_ctx._core import DiffCompressor; print('furl_ctx._core OK')"

      - name: Run test shard ${{ matrix.shard }}/4
        if: needs.changes.outputs.code == 'true'
        run: |
          pytest tests \
            --splits 4 --group ${{ matrix.shard }} \
            --tb=short -q

      - name: Set up Python 3.10 compatibility floor
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Replay shard ${{ matrix.shard }}/4 on Python 3.10
        if: needs.changes.outputs.code == 'true'
        run: |
          python -m pip install --upgrade pip
          WHEEL="$(ls dist/*.whl)"
          pip install "${WHEEL}[dev,mcp,code]" pytest-split google-re2
          rm -f furl_ctx/_core*.so
          SITE="$(python -c 'import sysconfig; print(sysconfig.get_path("platlib"))')"
          cp "${SITE}/furl_ctx/"_core*.so furl_ctx/
          python -c "from furl_ctx._core import DiffCompressor; print('Python 3.10 abi3 import OK')"
          # These six modules are repository/tooling policy guards, not runtime compatibility tests. Running
          # them under 3.10 creates a collection failure before any package compatibility test can run.
          py310_repo_policy_ignores=(
            --ignore=tests/test_optional_suites_not_silently_disarmed.py
            --ignore=tests/test_plugin_hooks_manifest.py
            --ignore=tests/test_plugin_version_pins.py
            --ignore=tests/test_regex_budget.py
            --ignore=tests/test_security_suite_requires_re2.py
            --ignore=tests/test_toolchain_pin_sync.py
          )
          pytest tests "${py310_repo_policy_ignores[@]}" \
            --splits 4 --group ${{ matrix.shard }} \
            --tb=short -q

      - name: Set up Python 3.14 compatibility ceiling
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Replay shard ${{ matrix.shard }}/4 on Python 3.14
        if: needs.changes.outputs.code == 'true'
        run: |
          python -m pip install --upgrade pip
          WHEEL="$(ls dist/*.whl)"
          pip install "${WHEEL}[dev,mcp,code]" pytest-split google-re2
          rm -f furl_ctx/_core*.so
          SITE="$(python -c 'import sysconfig; print(sysconfig.get_path("platlib"))')"
          cp "${SITE}/furl_ctx/"_core*.so furl_ctx/
          python -c "from furl_ctx._core import DiffCompressor; print('Python 3.14 abi3 import OK')"
          pytest tests \
            --splits 4 --group ${{ matrix.shard }} \
            --tb=short -q

  commitlint:
    # Advisory only.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout history for advisory commit audit
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Audit commit messages (advisory)
        id: commitlint
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6
        with:
          configFile: .commitlintrc.json

      - name: Keep commit-message style non-blocking
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          COMMITLINT_OUTCOME: ${{ steps.commitlint.outcome }}
        run: |
          if [[ "$CHECKOUT_OUTCOME" != "success" ]]; then
            echo "::warning::Could not read commit history; skipping the advisory commit-message audit."
            echo "Commit-message audit skipped because history checkout was unavailable." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$COMMITLINT_OUTCOME" == "failure" ]]; then
            echo "::warning::Some intermediate commit messages are not conventional. PR Health normalizes the PR title used for squash merging; Git history is not force-rewritten."
            {
              echo "## Commit-message audit"
              echo ""
              echo "Some intermediate commits do not match the conventional format."
              echo "This is advisory: PR Health fixes the PR title, and CI stays green rather than rewriting contributor history."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Commit-message audit passed." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-build-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-build-
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0  # keep in sync with rust-toolchain.toml (TEST-30)
      - uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2
        with:
          workspaces: ". -> target"
      # Smoke-check the shipped release-profile wheel and sdist; the release matrix performs the actual publication.
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install 'maturin>=1.9,<2.0' twine
      - name: Build wheel + sdist
        run: |
          maturin sdist --out dist
          maturin build --release --out dist
      - name: Check package
        run: twine check dist/*

      - name: Prove release wheel contains the repository Python payload
        run: |
          python - <<'PY'
          import pathlib
          import zipfile

          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one release wheel, found {len(wheels)}")

          source_root = pathlib.Path("furl_ctx")
          source = {
              path.as_posix(): path.read_bytes()
              for path in source_root.rglob("*")
              if path.is_file() and path.suffix in {".py", ".pyi"}
          }
          if not source:
              raise SystemExit("repository Python payload is unexpectedly empty")

          with zipfile.ZipFile(wheels[0]) as zf:
              packaged = {
                  name: zf.read(name)
                  for name in zf.namelist()
                  if name.startswith("furl_ctx/") and pathlib.PurePosixPath(name).suffix in {".py", ".pyi"}
              }

          missing = sorted(set(source) - set(packaged))
          unexpected = sorted(set(packaged) - set(source))
          changed = sorted(name for name in set(source) & set(packaged) if source[name] != packaged[name])
          if missing or unexpected or changed:
              raise SystemExit(
                  "release wheel Python payload diverges from the source tree: "
                  f"missing={missing} unexpected={unexpected} changed={changed}"
              )
          print(f"release wheel payload matches {len(source)} repository Python source/stub files byte-for-byte")
          PY

      - name: Exercise the installed release wheel outside the checkout
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          wheel="$(realpath "$wheel")"
          venv="${RUNNER_TEMP}/shipped-wheel-venv"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --upgrade pip
          "$venv/bin/python" -m pip install "$wheel"
          outside="${RUNNER_TEMP}/shipped-wheel-smoke"
          mkdir -p "$outside"
          cd "$outside"
          EXPECTED_WHEEL="$wheel" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" "$venv/bin/python" - <<'PY'
          import importlib.metadata
          import os
          import pathlib
          import furl_ctx
          from furl_ctx import compress, purge, resolve_markers, retrieve  # noqa: F401
          from furl_ctx._core import hello

          module_path = pathlib.Path(furl_ctx.__file__).resolve()
          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          if workspace in module_path.parents:
              raise SystemExit(f"import leaked to repository checkout: {module_path}")

          scripts = [
              ep for ep in importlib.metadata.entry_points(group="console_scripts")
              if ep.name == "furl"
          ]
          if len(scripts) != 1 or scripts[0].value != "furl_ctx.cli:main":
              raise SystemExit(f"unexpected furl console-script metadata: {scripts}")
          print(f"installed release wheel import OK: {module_path}; hello={hello()}")
          PY
          "$venv/bin/furl" --help >/dev/null
