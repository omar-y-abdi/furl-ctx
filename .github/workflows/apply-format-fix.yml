name: Apply formatter correction

on:
  push:
    branches:
      - agent/integrate-context-safety-improvements

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: apply formatter correction' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/integrate-context-safety-improvements
          fetch-depth: 1
      - name: Apply formatter correction
        shell: bash
        run: |
          set -euo pipefail
          python .format-fix.py
          git diff --check
          python -m py_compile furl_ctx/cache/compression_store.py
          git rm .format-fix.py .github/workflows/apply-format-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add furl_ctx/cache/compression_store.py
          git commit -m 'style: apply ruff formatting'
          git push origin HEAD:agent/integrate-context-safety-improvements
