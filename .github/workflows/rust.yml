name: rust

on:
  # Quota guard: no push trigger — main only receives squash-merged PRs whose tree the PR run
  # already tested (ruleset-required checks), so the post-merge re-run was pure double-billing.
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'Makefile'
      - '.github/workflows/rust.yml'
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

# Default permissions: read-only. Individual jobs override only what they need.
permissions:
  contents: read

jobs:
  test:
    name: test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable toolchain
        # Pin action code to @stable (latest fixes), toolchain version via input. The @1.95.0 ref shipped action code that errors on ubuntu-latest
        # with `detected conflict: 'bin/cargo-clippy'` because the pre-installed runner Rust collides with the clippy-preview component install.
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  wheels:
    name: wheels (${{ matrix.target }})
    # Quota guard: NOT on PRs. This job's macOS leg bills 10x (private repo) on every crates-touching PR, and PR-time Linux buildability is
    # already covered by the required `build-wheel` check; the release matrix provides the full cross-platform wheel gate.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            maturin-target: x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            maturin-target: aarch64-apple-darwin
        # This weekly drift job deliberately covers only the two primary targets (Linux x86_64 + Apple
        # Silicon) to bound recurring cron cost; the full cross-platform wheel gate lives in release.yml.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: "Build wheel (single-wheel architecture builds furl-ctx)"
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        # Maturin reads the root project configuration, which points at the Rust extension manifest for the cdylib.
        with:
          command: build
          args: --release --out dist
          target: ${{ matrix.maturin-target }}
      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2
      - name: Install cargo-audit + cargo-deny
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: cargo-audit,cargo-deny
      # SEC-8: both steps used to run `continue-on-error: true`, so a critical RUSTSEC advisory in the statically-linked graph (which vendors
      # onig_sys C/C++ and ring) could never turn CI red. They hard-fail now — each as its own named step so a red run points at the exact gate.
      - name: cargo audit
        run: cargo audit
      - name: cargo deny check licenses
        run: cargo deny check licenses
