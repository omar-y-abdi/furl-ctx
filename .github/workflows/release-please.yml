name: Release Please

# What this does
# ----------------
# release-please watches `main` for conventional-commit traffic and
# maintains a single "Release vX.Y.Z" PR that aggregates everything
# released since the last tag. Merging that PR is what triggers an
# actual PyPI / GitHub-Release publish. release.yml is triggered directly by
# the manifest update that lands on main, so it does not depend on GitHub
# re-emitting an event created by the bot token.
#
# This replaces the prior "every push to main is a release" pattern
# that burned PyPI's per-project storage quota by uploading a fresh
# wheel matrix (~200 MB) for each merged `fix:` / `feat:` PR.
#
# Day-to-day:
#   - Merge a `fix:` PR into main      -> bot updates the release PR
#   - Merge a `feat:` PR into main     -> bot bumps minor in release PR
#   - Merge `ci:` / `docs:` / `chore:` -> no PR change (hidden)
#   - Ready to ship                    -> merge the release PR
#                                       (manifest update starts release.yml;
#                                        the bot also creates the tag/release notes)
#
# Config lives in `.release-please-config.json`; current versions
# tracked in `.release-please-manifest.json`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  # Serialize bot runs on main so two pushes don't race the
  # release-PR update. We never cancel mid-flight — losing a manifest
  # write would mean the next push computes the wrong base version.
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # An action step cannot be wrapped by a shell retry function. The first
      # two attempts are allowed to fail, then the final attempt is authoritative.
      # Re-running release-please is safe: it reconciles the same release PR/tag.
      - name: Release Please (attempt 1/3)
        id: release_please_1
        continue-on-error: true
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Back off before retry 2
        if: steps.release_please_1.outcome == 'failure'
        run: sleep 15

      - name: Release Please (attempt 2/3)
        id: release_please_2
        if: steps.release_please_1.outcome == 'failure'
        continue-on-error: true
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Back off before retry 3
        if: steps.release_please_1.outcome == 'failure' && steps.release_please_2.outcome == 'failure'
        run: sleep 30

      - name: Release Please (attempt 3/3)
        if: steps.release_please_1.outcome == 'failure' && steps.release_please_2.outcome == 'failure'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
