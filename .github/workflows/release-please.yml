name: Release Please

# release-please maintains the version PR but cannot publish. Merging that PR updates the
# manifest; the release workflow verifies, tags, publishes PyPI, then creates the GitHub Release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  # Serialize bot runs on main so two pushes don't race the release-PR update.
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # An action step cannot be wrapped by a shell retry function. The first two attempts are allowed to fail, then the final attempt is authoritative.
      - name: Release Please (attempt 1/3)
        id: release_please_1
        continue-on-error: true
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Back off before retry 2
        if: steps.release_please_1.outcome == 'failure'
        run: sleep 15

      - name: Release Please (attempt 2/3)
        id: release_please_2
        if: steps.release_please_1.outcome == 'failure'
        continue-on-error: true
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Back off before retry 3
        if: steps.release_please_1.outcome == 'failure' && steps.release_please_2.outcome == 'failure'
        run: sleep 30

      - name: Release Please (attempt 3/3)
        if: steps.release_please_1.outcome == 'failure' && steps.release_please_2.outcome == 'failure'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
