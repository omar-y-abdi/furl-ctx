name: Apply cascade failure propagation

on:
  push:
    branches:
      - agent/integrate-context-safety-improvements
    paths:
      - .review-propagation-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/integrate-context-safety-improvements
          fetch-depth: 0
      - name: Apply assertion-guarded replacements
        run: python .github/apply_review_propagation.py
      - name: Static checks
        run: |
          python -m compileall -q furl_ctx/cache/compression_store.py furl_ctx/ccr/mcp_server.py tests/test_compression_store_review_regressions.py
          git diff --check
      - name: Commit fixes
        run: |
          rm -f .review-propagation-trigger .github/apply_review_propagation.py .github/workflows/apply-review-propagation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: propagate incomplete cascade deletion"
          git push origin HEAD:agent/integrate-context-safety-improvements
