name: Apply CI fix

on:
  push:
    branches:
      - agent/integrate-context-safety-improvements

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'stage CI fix applicator'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/integrate-context-safety-improvements
          fetch-depth: 1
      - name: Validate and apply CI fix
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .ci-fix.patch
          git apply .ci-fix.patch
          git rm .ci-fix.patch .github/workflows/apply-ci-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add furl_ctx
          git commit -m 'fix: address required CI regressions'
          git push origin HEAD:agent/integrate-context-safety-improvements
