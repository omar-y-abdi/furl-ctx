name: PR216 binding format

on:
  push:
    branches:
      - chatgpt/pr216-binding-id-red-20260911

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chatgpt/pr216-binding-id-red-20260911
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Format candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet ruff==0.16.2
          ruff format furl_ctx/cache/compression_store.py
          ruff check furl_ctx/cache/compression_store.py furl_ctx/cache/backends/memory.py furl_ctx/cache/backends/sqlite.py tests/test_pr216_binding_identity_security.py
          ruff format --check furl_ctx/cache/compression_store.py furl_ctx/cache/backends/memory.py furl_ctx/cache/backends/sqlite.py tests/test_pr216_binding_identity_security.py
          python -m compileall -q furl_ctx/cache/compression_store.py furl_ctx/cache/backends/memory.py furl_ctx/cache/backends/sqlite.py tests/test_pr216_binding_identity_security.py
          git diff --check
          git rm .github/workflows/pr216-binding-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add furl_ctx/cache/compression_store.py
          git commit -m "style: format opaque provenance changes"
          git push origin HEAD:chatgpt/pr216-binding-id-red-20260911
