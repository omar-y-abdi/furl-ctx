name: PR Health

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    # Keep labels fresh even when base branches move or checks finish later.
    - cron: '23 14 * * 1-5'
  workflow_dispatch:

permissions:
  # Branch updates use AUTOFIX_TOKEN; keep the built-in token read-only for code.
  # This workflow never checks out or executes pull-request code.
  contents: read
  issues: write
  pull-requests: write
  checks: read
  statuses: read
  # The status-check GraphQL rollup traverses checkSuite.workflowRun; without
  # actions:read every run dies with "Resource not accessible by integration".
  actions: read

concurrency:
  group: pr-health-${{ github.event.pull_request.number || github.ref }}
  # Updating a branch emits synchronize; let the current pass finish instead of
  # cancelling itself when that follow-up event arrives.
  cancel-in-progress: false

defaults:
  run:
    shell: bash -Eeuo pipefail {0}

jobs:
  label:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Prefer the PAT already used by autofix so an automatic branch update
      # starts normal CI. The built-in token remains the metadata/label token.
      UPDATE_TOKEN: ${{ secrets.AUTOFIX_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Normalize conventional PR titles without inventing semantics
        # Valid conventional prefixes are normalized mechanically. For a title without one, infer a type only from a complete, deterministic file set (docs-only, CI-only, lockfile-only,
        # or tests-only). Arbitrary source changes are never guessed as feat/fix/chore because that can change release-please semantics and silently suppress a real release.
        run: |
          retry() {
            local n=1
            until "$@"; do
              [[ "$n" == "3" ]] && return 1
              sleep $((n * 3))
              n=$((n + 1))
            done
          }

          retry gh label create "status: title needs type" \
            --repo "$REPO" \
            --color "d4c5f9" \
            --description "PR title needs an explicit conventional-commit type" \
            --force

          if jq -e '.pull_request.number' "$GITHUB_EVENT_PATH" >/dev/null 2>&1; then
            pr_numbers="$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")"
          else
            pr_numbers="$(retry gh pr list --repo "$REPO" --state open --limit 1000 --json number --jq '.[].number' || true)"
          fi

          for pr in $pr_numbers; do
            title="$(retry gh pr view "$pr" --repo "$REPO" --json title --jq '.title' || true)"
            if [[ -z "$title" ]]; then
              echo "::warning::Could not read PR #$pr title after retries; leaving it unchanged."
              continue
            fi

            files_json="$(retry gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              --slurp "repos/${REPO}/pulls/${pr}/files?per_page=100" || true)"
            if [[ -z "$files_json" ]]; then
              echo "::warning::Could not read the complete file set for PR #$pr; refusing semantic title inference."
              retry gh pr edit "$pr" --repo "$REPO" --add-label "status: title needs type" >/dev/null 2>&1 || true
              continue
            fi

            fixed="$(PR_TITLE="$title" PR_FILES="$files_json" python3 - <<'PY'
          import json
          import os
          import re

          allowed = {
              "build", "chore", "ci", "deps", "docs", "feat", "fix",
              "parity", "perf", "refactor", "revert", "style", "test",
          }
          raw = " ".join(os.environ.get("PR_TITLE", "").split()).strip()
          pages = json.loads(os.environ["PR_FILES"])
          items = [item for page in pages for item in page]
          paths = [item["filename"] for item in items]

          m = re.match(r"^([A-Za-z]+)(?:\(([^)]+)\))?(!)?:\s*(.*)$", raw)
          if m and m.group(1).lower() in allowed and m.group(4).strip():
              typ = m.group(1).lower()
              scope = m.group(2)
              bang = m.group(3) or ""
              subject = m.group(4).strip().rstrip(".").strip()
              if scope:
                  scope = re.sub(r"[^a-z0-9_.-]+", "-", scope.lower()).strip("-")
                  prefix = f"{typ}({scope}){bang}: " if scope else f"{typ}{bang}: "
              else:
                  prefix = f"{typ}{bang}: "
          else:
              bad_prefix = re.match(r"^[A-Za-z][A-Za-z0-9_-]*(?:\([^)]+\))?!?:\s*(.*)$", raw)
              subject = (bad_prefix.group(1) if bad_prefix else raw).strip().rstrip(".").strip()

              def docs_only(path: str) -> bool:
                  return path == "llms.txt" or path.endswith(".md") or path.startswith("docs/")

              def ci_only(path: str) -> bool:
                  return path.startswith(".github/workflows/")

              def lock_only(path: str) -> bool:
                  return path in {"Cargo.lock", "uv.lock"}

              def tests_only(path: str) -> bool:
                  return path.startswith("tests/") or path == "conftest.py"

              deterministic = None
              for typ, predicate in (
                  ("docs", docs_only),
                  ("ci", ci_only),
                  ("deps", lock_only),
                  ("test", tests_only),
              ):
                  if paths and all(predicate(path) for path in paths):
                      deterministic = typ
                      break

              if deterministic is None or not subject:
                  print("")
                  raise SystemExit(0)
              prefix = f"{deterministic}: "

          if not subject:
              print("")
              raise SystemExit(0)

          limit = max(1, 100 - len(prefix))
          if len(subject) > limit:
              cut = subject[:limit].rstrip()
              if " " in cut:
                  cut = cut.rsplit(" ", 1)[0].rstrip()
              subject = cut or subject[:limit]

          print(prefix + subject)
          PY
            )"

            if [[ -z "$fixed" ]]; then
              echo "::notice::PR #$pr needs an explicit conventional type; semantic guessing is intentionally disabled."
              retry gh pr edit "$pr" --repo "$REPO" --add-label "status: title needs type" >/dev/null 2>&1 || true
              continue
            fi

            if [[ "$fixed" != "$title" ]]; then
              if retry gh pr edit "$pr" --repo "$REPO" --title "$fixed" >/dev/null; then
                echo "Normalized PR #$pr title: $fixed"
              else
                echo "::warning::Could not normalize PR #$pr title after retries."
                continue
              fi
            fi
            retry gh pr edit "$pr" --repo "$REPO" --remove-label "status: title needs type" >/dev/null 2>&1 || true
          done

      - name: Ensure maintenance labels exist
        run: |
          retry() {
            local n=1
            until "$@"; do
              [[ "$n" == "3" ]] && return 1
              sleep $((n * 3))
              n=$((n + 1))
            done
          }

          retry gh label create "status: needs rebase" \
            --repo "$REPO" \
            --color "fbca04" \
            --description "Pull request branch is behind the base branch" \
            --force
          retry gh label create "status: has conflicts" \
            --repo "$REPO" \
            --color "d73a4a" \
            --description "Pull request has merge conflicts with the base branch" \
            --force
          retry gh label create "status: ci failing" \
            --repo "$REPO" \
            --color "d73a4a" \
            --description "Required or reported CI checks are failing" \
            --force
          retry gh label create "status: title needs type" \
            --repo "$REPO" \
            --color "d4c5f9" \
            --description "PR title needs an explicit conventional-commit type" \
            --force

      - name: Label open pull requests
        run: |
          retry() {
            local n=1
            until "$@"; do
              [[ "$n" == "3" ]] && return 1
              sleep $((n * 3))
              n=$((n + 1))
            done
          }

          if jq -e '.pull_request.number' "$GITHUB_EVENT_PATH" >/dev/null 2>&1; then
            pr_numbers="$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")"
          else
            pr_numbers="$(retry gh pr list --repo "$REPO" --state open --limit 1000 --json number --jq '.[].number')"
          fi

          failures=0
          for pr in $pr_numbers; do
            if ! data="$(retry gh pr view "$pr" --repo "$REPO" --json mergeStateStatus,statusCheckRollup,isCrossRepository,maintainerCanModify)"; then
              echo "Could not read PR #$pr after retries." >&2
              failures=$((failures + 1))
              continue
            fi

            merge_state="$(jq -r '.mergeStateStatus // "UNKNOWN"' <<<"$data")"
            is_cross_repo="$(jq -r '.isCrossRepository // false' <<<"$data")"
            maintainer_can_modify="$(jq -r '.maintainerCanModify // false' <<<"$data")"
            check_state="$(jq -r '
              [
                (.statusCheckRollup // [])[]
                | select((.conclusion // .state // "") as $s
                  | ["FAILURE", "TIMED_OUT", "ACTION_REQUIRED", "CANCELLED", "ERROR"] | index($s))
              ]
              | if length > 0 then "failing" else "passing" end
            ' <<<"$data")"

            if [[ "$merge_state" == "BEHIND" ]]; then
              updated=false
              # Same-repo PRs are always eligible. Fork PRs are attempted only when the author allowed
              # maintainer edits. Use AUTOFIX_TOKEN so the resulting synchronize event starts CI normally.
              if [[ -n "$UPDATE_TOKEN" && ( "$is_cross_repo" == "false" || "$maintainer_can_modify" == "true" ) ]]; then
                if GH_TOKEN="$UPDATE_TOKEN" retry gh pr update-branch "$pr" --repo "$REPO"; then
                  updated=true
                  echo "Updated PR #$pr with the latest base branch."
                else
                  echo "::warning::Could not update PR #$pr automatically; leaving the rebase label in place."
                fi
              elif [[ -z "$UPDATE_TOKEN" ]]; then
                echo "::warning::AUTOFIX_TOKEN is not configured; PR #$pr can be labeled but not safely auto-updated."
              fi

              if [[ "$updated" == "true" ]]; then
                retry gh pr edit "$pr" --repo "$REPO" --remove-label "status: needs rebase" >/dev/null 2>&1 || true
              else
                retry gh pr edit "$pr" --repo "$REPO" --add-label "status: needs rebase" || failures=$((failures + 1))
              fi
            else
              retry gh pr edit "$pr" --repo "$REPO" --remove-label "status: needs rebase" >/dev/null 2>&1 || true
            fi

            if [[ "$merge_state" == "DIRTY" ]]; then
              retry gh pr edit "$pr" --repo "$REPO" --add-label "status: has conflicts" || failures=$((failures + 1))
            else
              retry gh pr edit "$pr" --repo "$REPO" --remove-label "status: has conflicts" >/dev/null 2>&1 || true
            fi

            if [[ "$check_state" == "failing" ]]; then
              retry gh pr edit "$pr" --repo "$REPO" --add-label "status: ci failing" || failures=$((failures + 1))
            else
              retry gh pr edit "$pr" --repo "$REPO" --remove-label "status: ci failing" >/dev/null 2>&1 || true
            fi
          done

          if (( failures > 0 )); then
            echo "$failures PR-health update(s) still failed after retries." >&2
            exit 1
          fi
