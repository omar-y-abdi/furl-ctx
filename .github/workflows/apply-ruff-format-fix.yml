name: Apply Ruff formatter fix

on:
  push:
    branches:
      - agent/integrate-context-safety-improvements

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'stage Ruff formatter fix applicator'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/integrate-context-safety-improvements
          fetch-depth: 1
      - name: Validate and apply Ruff formatter fix
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .ruff-format-fix.patch
          git apply .ruff-format-fix.patch
          git rm .ruff-format-fix.patch .github/workflows/apply-ruff-format-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add furl_ctx
          git commit -m 'style: apply Ruff formatter output'
          git push origin HEAD:agent/integrate-context-safety-improvements
