[workspace]
resolver = "2"
members = [
    "crates/furl-core",
    "crates/furl-py",
]
# furl-py is a Python extension module — it must be built via maturin, not plain cargo (the
# "extension-module" feature tells pyo3 not to link libpython, which is required for `import` to work).
default-members = [
    "crates/furl-core",
]

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
authors = ["Furl Maintainers"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps JSON insertion order, `arbitrary_precision` preserves numeric lexemes, and `raw_value`
# exposes original fragments for byte-exact forwarding. These features prevent Python/Rust round-trip drift.
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision", "raw_value"] }
thiserror = "2"
tracing = "0.1"
pyo3 = { version = "0.29", features = ["abi3-py310"] }
# NOTE: the proxy-era workspace deps (clap, tokio, axum, tower, reqwest, anyhow, bytes, aws-sigv4/-config/-credential-types/-smithy-runtime-api,
# gcp_auth) were removed with the proxy/parity crates in the amputation (D7) — no remaining workspace member references them.


# Release builds strip symbols, use thin LTO, and one codegen unit to reduce wheel size. Keep panic
# unwinding so PyO3 can convert Rust panics to Python errors instead of aborting the host process.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

# Fast-to-compile profile for CI test wheels. The shipped wheel uses `release` (lto + codegen-units=1) for
# runtime/size; CI only needs a working extension, so trade runtime perf for ~parallel, lto-free compilation.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 256
opt-level = 1
strip = "none"
debug = false
incremental = false
