# GitGuardian configuration — secret-detection allowlist Two entries below are test fixtures, NOT real credentials. They live in tests that exercise our own
# detectors (volatile-content scanner, auth-mode classifier) — by definition we have to embed plausible-looking tokens to verify the detectors recognise them.

version: 2

secret:
  ignored-matches:
    # Canonical fake JWT used across the JS/Python ecosystem to demonstrate JWT-shaped
    # strings. We use it to verify our `detect_volatile_content` recogniser flags JWTs.
    - name: "fake JWT in volatile-content detector test"
      match: "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxIn0.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"

    # Anthropic-shaped strings whose payloads literally contain the word "fixture" — used in `test_realignment_live_multi_turn` to assert
    # the auth-mode classifier routes PAYG / OAuth / subscription headers correctly. No live API call is ever made with these tokens.
    - name: "Anthropic-shaped fixture token (PAYG via x-api-key)"
      match: "sk-ant-api03-payg-fixture"
    - name: "Anthropic-shaped fixture token (OAuth bearer)"
      match: "sk-ant-oat01-oauth-fixture"
    - name: "Anthropic-shaped fixture token (PAYG via bearer)"
      match: "sk-ant-api03-payg-bearer-fixture"

    # Minimal GitHub-shaped fixture tokens exercise OAuth, app, and PAT prefix detection; they are intentionally low-entropy and carry no privilege.
    - name: "GitHub OAuth token fixture (test_copilot_auth)"
      match: "gho_x"
    - name: "GitHub Apps token fixture (test_copilot_auth)"
      match: "ghs_x"
    - name: "GitHub PAT fixture (test_copilot_auth)"
      match: "ghp_x"
    - name: "GitHub fine-grained PAT fixture (test_copilot_auth)"
      match: "github_pat_x"
    - name: "Copilot session token fixture (test_copilot_auth)"
      match: "tid_x"
    - name: "GitHub OAuth token fixture for exchange_token test"
      match: "gho_test"
