[package]
name = "furl-py"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PyO3 bindings exposing furl-core to Python as furl_ctx._core."
# Linux/glibc builds require a compatibility shim compiled by the Cargo build script; keep the build-script hook enabled or Cargo skips the shim.
build = "build.rs"

[build-dependencies]
# Compile the C shim into a static library that links into _core.so.
cc = "1"

[lib]
name = "_core"
crate-type = ["cdylib"]
# Disable the default test harness
test = false
doctest = false
bench = false

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
furl-core = { path = "../furl-core" }
pyo3 = { workspace = true }
serde_json = { workspace = true }
