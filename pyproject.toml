[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "furl-ctx"
version = "1.4.0"
description = "Prompt and context compression for AI agents to reduce LLM token costs - typically 0-54% fewer tokens on real high-entropy content, up to 95% on repetitive logs/fixtures (best-case ceiling), reversible via CCR. Note: furl-ctx is not furl, the unrelated URL-manipulation library."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Omar Y. Abdi", email = "omar19970423@gmail.com" }
]
maintainers = [
    { name = "Omar Y. Abdi", email = "omar19970423@gmail.com" }
]
keywords = [
    "llm",
    "openai",
    "anthropic",
    "claude",
    "gpt",
    "context",
    "token",
    "optimization",
    "compression",
    "caching",
    "ai",
    "machine-learning",
    "context-compression",
    "claude-code",
    "claude-code-plugin",
    "mcp",
    "mcp-server",
    "ai-agents",
    "token-optimization",
    "context-window",
    "prompt-compression",
    "llm-token-costs",
    "context-pruning",
    "llm-context-memory",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    # Core: lightweight compression (SmartCrusher, ContentRouter, CCR) >=0.7.0: the default gpt-4o/o1 tokenizer needs the o200k_base encoding, which
    # tiktoken only ships from 0.7.0 — at the 0.5 floor every count degraded to chars/4 estimation via "ValueError: Unknown encoding o200k_base" (TEST-32b).
    "tiktoken>=0.7.0",            # Tokenizer for all compressors
    # Supported Python versions provide `tomllib`; the removed fallback no longer needs the backport.
]

[project.urls]
Homepage = "https://github.com/omar-y-abdi/furl-ctx"
Repository = "https://github.com/omar-y-abdi/furl-ctx"
Issues = "https://github.com/omar-y-abdi/furl-ctx/issues"

[project.scripts]
furl = "furl_ctx.cli:main"

[project.optional-dependencies]
# Linear-time regex engine for AGENT-SUPPLIED filter patterns (RG1). Optional, with a graceful fallback absent, matching falls back to stdlib `re` under a
# The SIGALRM regex budget works only on the main thread; MCP filter matching runs in worker threads, so install RE2 for bounded matching.
re2 = [
    "google-re2>=1.1",
]
# MCP server for Claude Code integration (furl_ctx.ccr.mcp_server).
mcp = [
    "mcp>=1.28.1,<2",
    "furl-ctx[re2]",
]
# Opt-in AST-verified code compression (transforms.code_aware_compressor, Engine P2-12; enable via ContentRouterConfig.enable_code_aware=True). Missing extra → the compressor
# fails open (passthrough + one WARN). tree-sitter>=0.23 pins the `parser.language =` setter API and the unsendable-parser contract the thread-local cache satisfies.
code = [
    "tree-sitter>=0.23.0",
    "tree-sitter-language-pack>=0.7.0",
]
# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.16.2",
    "mypy>=1.14.1",
    "pre-commit>=3.0.0",
    # Parses CI configuration for the meta-test that keeps required-check coverage aligned with imported code.
    # deadlock (#15/#32/#56) from re-entering the workflow. >=6 for the safe_load-by-default API.
    "pyyaml>=6",
    # The ReDoS and marker-scan suites assert catastrophic-backtracking and 10 MiB scan bounds, so edits affecting those paths must run the security tests.
    # bounds that ONLY hold under RE2's linear-time engine. Pull it into `dev` so every test install carries the engine those tests require by construction;
    "furl-ctx[re2]",
    # Include the MCP extra in `dev` so collection-gated MCP tests cannot silently disappear when the
    # SDK is absent. The optional-suite guard turns any missing dependency into a hard CI failure.
    "furl-ctx[mcp]",
    # Include the code/tree-sitter extra in `dev` so AST-aware tests run in normal test/CI installs
    # instead of silently skipping. Core end-user installs remain lean and opt in separately.
    "furl-ctx[code]",
]
# All optional dependencies (everything the compression library can use). Must reach EVERY
# feature extra (re2, mcp, code): `mcp` already pulls `re2`, so `mcp` + `code` covers the set.
all = [
    "furl-ctx[mcp]",
    "furl-ctx[code]",
]

# Maturin builds one wheel containing the Python package and compiled `_core` extension; installation is atomic with no companion package.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
default = true

[tool.maturin]
# Maturin packages `furl_ctx` with bundled configs. Include the required license and notice artifacts because PEP 639 metadata must resolve in published distributions.
include = [
    { path = "LICENSE", format = "sdist" },
    { path = "NOTICE", format = "sdist" },
]
python-source = "."
module-name = "furl_ctx._core"
# Use the Rust cdylib manifest configured below.
manifest-path = "crates/furl-py/Cargo.toml"
features = ["extension-module"]
# Require the cdylib feature so builds produce a usable PyO3 extension.
bindings = "pyo3"

[tool.ruff]
target-version = "py310"
line-length = 100
# Exclude Claude Code tooling/skills directories — these are agent-runtime
# scripts, not project code, and are not present in CI git checkouts.
exclude = [".claude/agents", ".claude/hooks", ".claude/skills"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B905",  # zip without strict parameter
]

[tool.ruff.lint.isort]
known-first-party = ["furl_ctx"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
filterwarnings = [
    # pyo3 Unsendable parsers emit an unraisable warning when GC drops them on a test-teardown thread; this is a test-harness
    # artifact, not a production issue (production threads are long-lived and drop their parsers on themselves).
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
# `real_llm` / `live` markers removed (TEST-20/TEST-24): the proxy-era network suites they served are
# Removed marks have no remaining tests. `slow` stays because four tests still use it.
markers = [
    "slow: slow tests (model loads, large fixtures)",
]

[tool.coverage.run]
source = ["furl_ctx"]
branch = true
omit = [
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
